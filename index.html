/* ---------- New person + first loan form ---------- */
function NewPersonForm({ t, lang, existingPeople, onSave }){
  const [name, setName] = useState(loadLS('lifestyle_draft_np_name', ''));
  const [mobile, setMobile] = useState(loadLS('lifestyle_draft_np_mobile', ''));
  const [contactNumbers, setContactNumbers] = useState([]);
  const [showNumberPicker, setShowNumberPicker] = useState(false);
  const [expectedReturnDate, setExpectedReturnDate] = useState(loadLS('lifestyle_draft_np_expectedReturnDate', '') || firstDayOfMonth());
  const [amount, setAmount] = useState(loadLS('lifestyle_draft_np_amount', ''));
  const [date, setDate] = useState(firstDayOfMonth());
  const [fromChannel, setFromChannel] = useState(loadLS('lifestyle_draft_np_fromChannel', 'Bank Account'));
  const [toChannel, setToChannel] = useState(loadLS('lifestyle_draft_np_toChannel', 'Bank Account'));
  const [note, setNote] = useState(loadLS('lifestyle_draft_np_note', ''));
  const [contactMsg, setContactMsg] = useState('');
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_name', name); }catch(e){} }, [name]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_mobile', mobile); }catch(e){} }, [mobile]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_expectedReturnDate', expectedReturnDate); }catch(e){} }, [expectedReturnDate]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_amount', amount); }catch(e){} }, [amount]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_date', date); }catch(e){} }, [date]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_fromChannel', fromChannel); }catch(e){} }, [fromChannel]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_toChannel', toChannel); }catch(e){} }, [toChannel]);
  useEffect(()=>{ try{ saveLS('lifestyle_draft_np_note', note); }catch(e){} }, [note]);
  function pickExisting(p){ setName(p.name); if(p.mobile) setMobile(p.mobile); }
  function selectNumber(num){ setMobile(num); setShowNumberPicker(false); setContactNumbers([]); }
  async function handlePickContact(){
    setContactMsg('');
    try{
      if(navigator.contacts && navigator.contacts.select){
        const props = ['name','tel'];
        const opts = { multiple: false };
        const contacts = await navigator.contacts.select(props, opts);
        if(contacts && contacts.length>0){
          const c = contacts[0];
          if(c.name && c.name[0]) setName(c.name[0]);
          if(c.tel && c.tel.length>0){
            // FIX: normalize and dedupe numbers - remove duplicates like +880 1779--166553 vs +8801779166553
            const seen = new Set();
            const clean = [];
            c.tel.forEach(raw => {
              const digits = (raw||'').toString().replace(/\D/g,'');
              const key = digits.slice(-10); // last 10 digits as unique key
              if(key && !seen.has(key)){
                seen.add(key);
                clean.push(raw.toString().trim());
              }
            });
            if(clean.length===1){
              // single number -> auto fill directly, no bottom sheet needed
              setMobile(clean[0]);
            } else {
              setContactNumbers(clean);
              setShowNumberPicker(true);
            }
          }
        }
      } else {
        setContactMsg(t.contactUnsupported || (lang==='bn' ? 'এখানে কন্টাক্ট সাপোর্ট নেই' : 'Contact not supported'));
      }
    }catch(e){
      if(e && e.name!=='NotAllowedError'){
        setContactMsg(t.contactUnsupported || '');
      }
    }
  }
  function submit(){
    if(!name || !amount) return;
    try{
      saveLS('lifestyle_draft_np_name', '');
      saveLS('lifestyle_draft_np_mobile', '');
      saveLS('lifestyle_draft_np_expectedReturnDate', '');
      saveLS('lifestyle_draft_np_amount', '');
      saveLS('lifestyle_draft_np_date', '');
      saveLS('lifestyle_draft_np_fromChannel', '');
      saveLS('lifestyle_draft_np_toChannel', '');
      saveLS('lifestyle_draft_np_note', '');
    }catch(e){}
    onSave({ name: name.trim(), mobile: mobile.trim(), amount: parseFloat(amount)||0, date, note, expectedReturnDate, returnDate: expectedReturnDate, fromChannel: fromChannel, toChannel: toChannel, channel: fromChannel, fromMedium: fromChannel, toMedium: toChannel, medium: fromChannel, method: fromChannel });
  }
  return h('div', {className:'-mx-5 -mt-1.5'},
    h('div', {className:'sticky z-20 bg-[#FFFBF7] px-5 py-3 border-b border-[#F3E8D3] flex gap-2', style:{top:'44px'}},
      h('button', {onClick:submit, disabled: !amount, className:'flex-1 py-3.5 rounded-[14px] font-bold text-[15px] bg-[#2D2A26] text-white disabled:opacity-40'}, t.saveLoan),
      h('button', {type:'button', className:'px-5 py-3.5 rounded-[14px] font-bold text-[14px] bg-white border border-[#F3E8D3]'}, t.cancel)
    ),
    h('div', {className:'pt-4 px-5 pb-5'},
      existingPeople && existingPeople.length > 0 ? h('div', {className:'mb-3'},
        h('p', {className:'text-[11px] font-bold text-[#8B7355] mb-1.5'}, t.selectExisting),
        h('div', {className:'flex flex-wrap gap-1.5'},
          existingPeople.map(p => h('button', {
            key:p.id, type:'button', onClick:()=>pickExisting(p),
            className:'px-3 py-1.5 rounded-full text-[12px] font-semibold border ' + (name===p.name ? 'bg-[#2D2A26] text-white border-[#2D2A26]' : 'bg-white border-[#F3E8D3]')
          }, p.name))
        )
      ) : null,
      h(Field, {label: t.name}, 
        h('div', {className:'flex gap-2 items-center'},
          h('div', {className:'flex-1'}, h(TextInput, {value:name, onChange:e=>setName(e.target.value), placeholder: t.newPersonName})),
          h('button', {type:'button', onClick:handlePickContact, className:'w-[46px] h-[46px] rounded-[14px] bg-white border border-[#F3E8D3] flex items-center justify-center text-[20px] shrink-0', title: t.pickContact || 'Contact'}, '📇')
        )
      ),
      h(Field, {label: lang==='bn'?'মোবাইল / কন্টাক্ট নাম্বার':'Mobile / Contact Number'},
        h('div', null,
          h('div', {className:'flex gap-2 items-center'},
            h('div', {className:'flex-1'}, h(TextInput, {type:'tel', value:mobile, onChange:e=>setMobile(e.target.value), placeholder: lang==='bn'?'ম্যানুয়ালি লিখুন বা কন্টাক্ট থেকে বাছুন':'Type manually or pick from contacts'})),
            h('button', {type:'button', onClick:handlePickContact, className:'w-[46px] h-[46px] rounded-[14px] bg-white border border-[#F3E8D3] flex items-center justify-center text-[18px] shrink-0', title: t.pickContact || 'Contact'}, '📞')
          ),
          contactMsg ? h('p', {className:'text-[11px] text-[#8B7355] mt-1.5'}, contactMsg) : null
        )
      ),
      showNumberPicker ? h('div', {className:'fixed inset-0 z-[85] flex items-end justify-center'},
        h('div', {className:'absolute inset-0 bg-black/40', onClick:()=>{ setShowNumberPicker(false); }}),
        h('div', {className:'relative w-full max-w-[460px] bg-white rounded-t-[24px] border border-[#F3E8D3] max-h-[70vh] overflow-y-auto'},
          h('div', {className:'sticky top-0 bg-white px-5 py-3 border-b border-[#F3E8D3] flex items-center justify-between'},
            h('p', {className:'font-bold text-[15px]'}, lang==='bn' ? 'নম্বর বাছুন' : 'Select Number'),
            h('button', {type:'button', onClick:()=>setShowNumberPicker(false), className:'w-8 h-8 rounded-full bg-[#F3E8D3] flex items-center justify-center'}, '✕')
          ),

              key:i, type:'button',
              onClick:()=>selectNumber(num),
              className:'w-full text-left px-4 py-3.5 rounded-[14px] border-2 bg-[#FFFBF7] border-[#F3E8D3] hover:border-[#2D2A26] hover:bg-white transition-all flex items-center justify-between'
            },
              h('div', {className:'flex items-center gap-3'},
                h('span', {className:'w-8 h-8 rounded-full bg-[#2D2A26] text-white flex items-center justify-center text-[13px] font-bold'}, i+1),

/* ---------- Bank loan form ---------- */
function BankLoanForm({ t, lang, initial, onSave }){
  const [bankName, setBankName] = useState(initial ? initial.bankName : loadLS('lifestyle_draft_bank_bankName', BANKS[0]));
  const [amount, setAmount] = useState(initial ? String(initial.amount) : loadLS('lifestyle_draft_bank_amount', ''));
  const [term, setTerm] = useState(initial ? String(initial.termMonths) : loadLS('lifestyle_draft_bank_term', '24'));
  const [rate, setRate] = useState(initial ? String(initial.interestRate) : loadLS('lifestyle_draft_bank_rate', '9'));
  const [disbursementDate, setDisbursementDate] = useState(initial ? (initial.disbursementDate || initial.loanDate || today()) : firstDayOfMonth());
  const [emiStartDate, setEmiStartDate] = useState(initial ? (initial.emiStartDate || initial.loanDate || today()) : firstDayOfMonth());
  const [paidEmis, setPaidEmis] = useState(initial && initial.paidEmis ? initial.paidEmis.slice() : []);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_bankName', bankName); }catch(e){} } }, [bankName, initial]);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_amount', amount); }catch(e){} } }, [amount, initial]);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_term', term); }catch(e){} } }, [term, initial]);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_rate', rate); }catch(e){} } }, [rate, initial]);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_disbursementDate', disbursementDate); }catch(e){} } }, [disbursementDate, initial]);
  useEffect(()=>{ if(!initial){ try{ saveLS('lifestyle_draft_bank_emiStartDate', emiStartDate); }catch(e){} } }, [emiStartDate, initial]);
  const emi = calcEMI(parseFloat(amount)||0, parseFloat(rate)||0, parseInt(term)||1);
  const emiEndDate = useMemo(()=>{
    const n = parseInt(term)||1;
    return emiStartDate ? addMonths(emiStartDate, n-1) : '';
  }, [emiStartDate, term]);
  function togglePaid(i){
    setPaidEmis(prev=>{
      const next = prev.slice();
      while(next.length < (parseInt(term)||1)) next.push(false);
      next[i] = !next[i];
      return next;
    });
  }
  function submit(){
    if(!amount || !term) return;
    const n = parseInt(term)||1;
    let p = paidEmis.slice();
    if(p.length !== n){
      const resized = Array(n).fill(false);
      for(let i=0;i<Math.min(n, p.length);i++) resized[i] = p[i];
      p = resized;
    }
    onSave({
      id: initial?initial.id:uid(), bankName, amount:parseFloat(amount)||0, termMonths:n,
      interestRate:parseFloat(rate)||0, loanDate: disbursementDate,
      disbursementDate, emiStartDate, emiEndDate, paidEmis: p
    });
  }
  const n = parseInt(term)||24;
  const rows = [];
  for(let i=0;i<n;i++){
    const d = new Date(emiStartDate);
    d.setMonth(d.getMonth()+i);
    const ds = d.toISOString().split('T')[0];
    rows.push({ idx:i, date: ds, paid: !!(paidEmis[i]) });
  }
  return h('div', {className:'-mx-5 -mt-1.5'},
    h('div', {className:'sticky z-20 bg-[#FFFBF7] px-5 py-3 border-b border-[#F3E8D3] flex gap-2', style:{top:'44px'}},
      h('button', {onClick:submit, disabled: !amount || !term, className:'flex-1 py-3.5 rounded-[14px] font-bold text-[15px] bg-[#2D2A26] text-white disabled:opacity-40'}, t.saveLoan),
      h('button', {type:'button', className:'px-5 py-3.5 rounded-[14px] font-bold text-[14px] bg-white border border-[#F3E8D3]'}, t.cancel)
    ),
    h('div', {className:'pt-4'},
      h(Field, {label:t.bankName}, h(Select, {value:bankName, onChange:e=>setBankName(e.target.value)},
        BANKS.map(b=>h('option', {key:b, value:b}, b))
      )),
      h('div', {className:'grid grid-cols-2 gap-3'},
        h(Field, {label:t.loanAmount}, h(TextInput, {type:'number', value:amount, onChange:e=>setAmount(e.target.value)})),
        h(Field, {label:t.termMonths}, h(TextInput, {type:'number', value:term, onChange:e=>setTerm(e.target.value)}))
      ),
      h(Field, {label:t.interestRate}, h(TextInput, {type:'number', step:'0.1', value:rate, onChange:e=>setRate(e.target.value)})),
      h('div', {className:'grid grid-cols-2 gap-3'},
        h(Field, {label:t.disbursementDate}, h(TextInput, {type:'date', value:disbursementDate, onChange:e=>setDisbursementDate(e.target.value)})),
        h(Field, {label:t.emiStartDate}, h(TextInput, {type:'date', value:emiStartDate, onChange:e=>setEmiStartDate(e.target.value)}))
      ),
      h(Field, {label:t.emiEndDate}, h(TextInput, {type:'date', value:emiEndDate, disabled:true, className:'w-full bg-[#F3E8D3]/40 border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] outline-none text-[#8B7355]'})),

      amount && term ? h('div', {className:'bg-[#2D2A26] rounded-[16px] p-4 text-white mb-3 flex justify-between'},
        h('span', {className:'text-[12px] text-white/70'}, 'EMI'),
        h('span', {className:'font-bold'}, fmtMoney(emi))
      ) : null,

      h('div', {className:'mt-4'},
        h('div', {className:'flex items-center justify-between mb-2'},
          h('p', {className:'font-bold text-[13px]'}, lang==='bn'?'EMI শিট (Excel আকারে)':'EMI Sheet'),
          h('p', {className:'text-[11px] text-[#8B7355]'}, (paidEmis.filter(Boolean).length||0) + '/' + n + ' Paid')
        ),
        h('div', {className:'bg-white rounded-[14px] border border-[#F3E8D3] overflow-hidden'},
          h('div', {className:'overflow-x-auto'},
            h('table', {className:'w-full text-[12px]'},
              h('thead', {className:'bg-[#F9F5EB]'},
                h('tr', null,
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, 'SL No'),
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, lang==='bn'?'তারিখ':'Date'),
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, 'EMI'),
                  h('th', {className:'px-3 py-2.5 text-center font-bold'}, lang==='bn'?'পরিশোধ':'Paid')
                )
              ),
              h('tbody', null,
                rows.map(r => h('tr', {
                  key:r.idx,
                  className: 'border-t border-[#F3E8D3] ' + (r.paid ? 'bg-[#E8F5E9]' : 'bg-[#FFEBEE]')
                },
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3]'}, r.idx+1),
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3]'}, r.date),
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3] font-semibold'}, fmtMoney(emi)),
                  h('td', {className:'px-3 py-2.5 text-center'},
                    h('button', {
                      type:'button',
                      onClick:()=>togglePaid(r.idx),
                      className:'w-7 h-7 rounded-[6px] border-2 flex items-center justify-center text-[16px] font-bold mx-auto ' + (r.paid ? 'bg-[#4CAF50] border-[#4CAF50] text-white' : 'bg-white border-[#FFCDD2] text-[#B71C1C]')
                    }, r.paid ? '✓' : '☐')
                  )
                ))
              )
            )
          )
        )
      )
    )
  );
}

/* ---------- Person Detail Page ---------- */
function PersonDetail({ t, lang, kind, person, onBack, onUpdatePerson, onDeletePerson, userName }){
  const [addingLoan, setAddingLoan] = useState(false);
  const [addingPayment, setAddingPayment] = useState(false);
  const [editingLoan, setEditingLoan] = useState(null);
  const [editingPayment, setEditingPayment] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null); // {kind:'loan'|'payment'|'person', id}
  const [confirmDelFinal, setConfirmDelFinal] = useState(null);

  const totalLoaned = person.loans.reduce((a,l)=>a+l.amount,0);
  const totalPaid = person.payments.reduce((a,p)=>a+p.amount,0);
  const balance = totalLoaned - totalPaid;

  function saveLoan(loan){
    const loans = editingLoan
      ? person.loans.map(l => l.id === loan.id ? loan : l)
      : [loan, ...person.loans];
    onUpdatePerson(Object.assign({}, person, {loans}));
    setAddingLoan(false); setEditingLoan(null);
  }
  function savePayment(p){
    const payments = editingPayment
      ? person.payments.map(x => x.id === p.id ? p : x)
      : [p, ...person.payments];
    onUpdatePerson(Object.assign({}, person, {payments}));
    setAddingPayment(false); setEditingPayment(null);
  }
  function doDeleteFirst(){
    if(!confirmDel) return;
    setConfirmDelFinal(confirmDel);
    setConfirmDel(null);
  }
  function doDeleteFinal(){
    const target = confirmDelFinal || confirmDel;
    if(!target) return;
    if(target.kind === 'loan'){
      onUpdatePerson(Object.assign({}, person, {loans: person.loans.filter(l=>l.id!==target.id)}));
    } else if(target.kind === 'payment'){
      onUpdatePerson(Object.assign({}, person, {payments: person.payments.filter(p=>p.id!==target.id)}));
    } else if(target.kind === 'person'){
      onDeletePerson(person.id);
    }
    setConfirmDel(null);
    setConfirmDelFinal(null);
  }

  const balanceLabel = kind === 'given' ? t.youWillGet : t.youOwe;

  const [editingPerson, setEditingPerson] = useState(false);
  const [editName, setEditName] = useState(person.name);
  const [editMobile, setEditMobile] = useState(person.mobile||'');

    const nm = (editName||'').trim();
    if(!nm){ alert(t.newPersonName||'Name required'); return; }
    onUpdatePerson(Object.assign({}, person, {name:nm, mobile:(editMobile||'').trim()}));
    setEditingPerson(false);
  }

  return h('div', {className:'pt-5 pb-6 space-y-4'},
    h('div', {className:'flex items-center gap-2'},
      h(IconBtn, {onClick:onBack}, '\u2190'),
      h('h2', {className:'text-[18px] font-bold flex-1'}, person.name),

        h('button', {onClick:()=>{ setEditName(person.name); setEditMobile(person.mobile||''); setEditingPerson(true); }, className:'w-12 h-12 rounded-full bg-white border-2 border-[#F3E8D3] flex items-center justify-center text-[16px] font-bold', title:'Edit'}, 'Edit'),
        h('button', {onClick:()=>setConfirmDel({kind:'person'}), className:'w-12 h-12 rounded-full bg-white border-2 border-[#FFCDD2] flex items-center justify-center text-[20px]'}, '\uD83D\uDDD1')
      )
    ),
    person.mobile ? h('p', {className:'text-[12px] text-[#8B7355] -mt-2'}, person.mobile) : null,
    h('div', {className:'bg-[#2D2A26] rounded-[20px] p-4 text-white'},
      h('p', {className:'text-[12px] text-white/70'}, balanceLabel),
      h('p', {className:'text-[24px] font-bold mt-1'}, fmtMoney(balance)),
      h('div', {className:'flex justify-between text-[11px] text-white/60 mt-2'},
        h('span', null, t.total + ': ' + fmtMoney(totalLoaned)),

function PeopleList({ t, lang, kind, people, onOpenPerson, onAddPerson, userName }){

  function handleCombinedPdf(mode){

      let filteredPeople = people;
      if(filterFrom || filterTo){
        filteredPeople = people.map(p=>{
          const fLoans = p.loans.filter(l=>{ if(filterFrom && l.date < filterFrom) return false; if(filterTo && l.date > filterTo) return false; return true; });
          const fPays = p.payments.filter(pay=>{ if(filterFrom && pay.date < filterFrom) return false; if(filterTo && pay.date > filterTo) return false; return true; });
          return Object.assign({}, p, {loans: fLoans, payments: fPays});
        }).filter(p=>p.loans.length>0 || p.payments.length>0);
      }
      const blob = buildAllLoansPdfBlob({t, lang, kind, people: filteredPeople, userName: resolved, userDesignation: lsD, userAddress: lsA, userMobile: lsM, generatedAt: genAt, appName: t.appName, from: filterFrom, to: filterTo});

      else if(mode==='share') shareOrDownloadPdf(blob, fname, 'All ' + kind + ' history');

  }

        h('button', {onClick:()=>handleCombinedPdf('download'), className:'flex-1 py-2.5 rounded-[12px] bg-[#2D2A26] text-white text-[13px] font-bold'}, '📄 PDF'),
        h('button', {onClick:()=>handleCombinedPdf('view'), className:'flex-1 py-2.5 rounded-[12px] bg-white border border-[#F3E8D3] text-[#2D2A26] text-[11px] font-bold'}, '👁️ View'),
        h('button', {onClick:()=>handleCombinedPdf('share'), className:'flex-1 py-2.5 rounded-[12px] bg-[#C9A86A] text-[#2D2A26] text-[11px] font-bold'}, '📤 Share')
      ),
      h('div', {className:'grid grid-cols-2 gap-3'},
        h(Field, {label:t.dateFrom}, h(TextInput, {type:'date', value:filterFrom, onChange:e=>setFilterFrom(e.target.value)})),
        h(Field, {label:t.dateTo}, h(TextInput, {type:'date', value:filterTo, onChange:e=>setFilterTo(e.target.value)}))

function buildPdfFromJpegs(jpegs){
  const enc = new TextEncoder(), chunks = [], offsets = [];
  let len = 0;
  function push(x){ const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; }
  const n = jpegs.length, total = 2 + 3*n;
  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = []; for(let i=0;i<n;i++) kids.push((3+i*3)+' 0 R');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\nendobj\n');
  for(let i=0;i<n;i++){
    const pg = 3+i*3, ct = pg+1, im = pg+2, j = jpegs[i];
    offsets[pg] = len;
    push(pg + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\nendobj\n');
    const content = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
    offsets[ct] = len;
    push(ct + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    offsets[im] = len;
    push(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + j.w + ' /Height ' + j.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.bytes.length + ' >>\nstream\n');
    push(j.bytes); push('\nendstream\nendobj\n');
  }
  const xref = len;
  let x = 'xref\n0 ' + (total+1) + '\n0000000000 65535 f \n';
  for(let i=1;i<=total;i++) x += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + (total+1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, {type:'application/pdf'});
}

async function shareOrDownloadPdf(blob, filename, title){
  // 1. Try native share (works best on mobile Chrome)
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title}); return 'shared'; }
      catch(e){ if(e && e.name === 'AbortError') return 'cancelled'; }
    }
  }catch(e){}
  
  // 2. Try to convert to dataURL for WebView (AppsGeyser fix)
  const isWebView = /wv|WebView|Android.*Version/.test(navigator.userAgent) || window.AndroidInterface || typeof Android !== 'undefined';
  
  try{
    // For WebView: open blob url in external browser
    const url = URL.createObjectURL(blob);
    if(isWebView){
      // Try Android interface or open in system browser
      window.open(url, '_blank');
      // Also try data url download for APK
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const dataUrl = reader.result;
          // Create hidden link with data URL - works in WebView
          const a2 = document.createElement('a');
          a2.href = dataUrl;
          a2.download = filename;
          a2.target = '_blank';
          document.body.appendChild(a2);
          a2.click();
          setTimeout(()=>a2.remove(), 2000);
        }catch(e2){}
      };
      reader.readAsDataURL(blob);
      setTimeout(()=>URL.revokeObjectURL(url), 10000);
      return 'downloaded';
    } else {
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
      return 'downloaded';
    }
  }catch(e){
    // Final fallback: open as data url
    try{
      const reader = new FileReader();
      const dataUrl = await new Promise((res,rej)=>{ reader.onload=()=>res(reader.result); reader.onerror=rej; reader.readAsDataURL(blob); });
      window.location.href = dataUrl;
      return 'downloaded';
    }catch(e2){ alert('PDF তৈরি হয়েছে, কিন্তু ডাউনলোড ব্লক হয়েছে। Chrome ব্রাউজারে লিংক দিয়ে খুলুন।'); }
  }
  return 'downloaded';
}

            h('span', {className:'text-[16px]'}, '💾'), h('span', null, saving ? 'Saving...' : (editingDailyTaskId ? 'Update' : 'Save'))

function toTitleCase(str){ try{ if(!str) return ''; return str.replace(/_/g,' ').replace(/\b\w+/g, function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }); }catch(e){ return str; } }
function formatDMY(d){ try{ if(!d) return ''; const parts=d.split('-'); if(parts.length!==3) return d; return parts[2]+'/'+parts[1]+'/'+parts[0]; }catch(e){ return d; } }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function getTokens(str){
    if(!str) return [];
    return str.toLowerCase().split(/[\s,]+/).filter(x=>x.trim());
  }
  function isMatch(item, tokens){
    if(tokens.length===0) return true;
    const en=(item.en||'').toLowerCase();
    const bn=item.bn||'';
    return tokens.every(t=> en.includes(t) || bn.includes(t) || bn.toLowerCase().includes(t));
  }
  const filteredBusiness = React.useMemo(()=>{

    return BUSINESS_TYPES.filter(b=> !(form.selectedBizItems||[]).some(s=>s.bn===b.bn && s.en===b.en) && isMatch(b, tokens));

  function handleSaveSection(section){
    // MULTI-PERSON FIX: save current form to surveyList as one person entry
    try{
      const personEntry = {...form, id: editingId || (Date.now()+'_'+Math.random().toString(36).slice(2)), updatedAt: new Date().toISOString(), ownerName: form.ownerName || form.businessName || 'Unnamed'};
      setSurveyList(prev=>{
        if(editingId){
          return prev.map(p=> p.id===editingId ? personEntry : p);
        } else {
          // if same mobile exists, update else add
          const idx = prev.findIndex(p=> p.mobileNo && form.mobileNo && p.mobileNo===form.mobileNo);
          if(idx>=0){
            const copy=[...prev]; copy[idx]=personEntry; return copy;
          }
          return [personEntry, ...prev];
        }
      });
      setEditingId(personEntry.id);
    }catch(e){}
    setSaving(true);
    try{
      const user = firebase.auth().currentUser;
      const payload = {...form, section, updatedAt: new Date().toISOString()};
      if(user && firebase.firestore){
        firebase.firestore().collection('market_surveys').doc(user.uid+'_'+Date.now()).set({...payload, uid:user.uid})
        .then(()=>{ setToast && setToast(section+' saved to Firebase'); setSaving(false); })
        .catch(e=>{ setToast && setToast('Saved locally'); setSaving(false); try{ localStorage.setItem('market_survey_'+section+'_'+Date.now(), JSON.stringify(payload)); }catch(err){} });
      } else {
        try{ localStorage.setItem('market_survey_'+section+'_'+Date.now(), JSON.stringify(payload)); }catch(err){}
        setToast && setToast(section+' saved locally');
        setSaving(false);
      }
    }catch(e){ setSaving(false); setToast && setToast('Error '+e.message); }
  }

  const [toDiv, setToDiv] = React.useState('');
  const [toDist, setToDist] = React.useState('');
  const [toUpa, setToUpa] = React.useState('');
  const [toDate, setToDate] = React.useState(()=>today());
  
  const [selected, setSelected] = React.useState([]);
  const [search, setSearch] = React.useState('');
  const [openGroups, setOpenGroups] = React.useState({electronics:true});
  const [editingId, setEditingId] = React.useState(null);
  const [othersNote, setOthersNote] = React.useState(()=>{ try{ return localStorage.getItem('travel_others_note')||''; }catch(e){ return ''; } });

  React.useEffect(()=>{ try{ localStorage.setItem('lifestyle_travel_list', JSON.stringify(travelList)); }catch(e){} }, [travelList]);

  const getDistricts = (divId)=>{ const d=BD_DIVISIONS.find(x=>x.id===divId); return d? d.districts: []; };
  const getUpazilas = (divId, distId)=>{ const dists=getDistricts(divId); const di=dists.find(x=>x.id===distId); return di? di.upazilas: []; };

  const buildLocationString = (div, dist, upa)=>{
    let parts=[];
    if(upa) parts.push(upa);
    if(dist){ const d=getDistricts(div).find(x=>x.id===dist); parts.push(d? (d.bn||d.en): dist); }
    if(div){ const dv=BD_DIVISIONS.find(x=>x.id===div); parts.push(dv? (dv.bn||dv.en): div); }
    return parts.join(', ') || '';
  };

  const handleSelect = (id)=>{ setSelected(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]); };

  const handleSave = ()=>{
    const fromLoc = buildLocationString(fromDiv, fromDist, fromUpa);
    const toLoc = buildLocationString(toDiv, toDist, toUpa);
    if(!fromLoc || !toLoc){ setToast && setToast('From এবং Destination সিলেক্ট করুন'); return; }
    if(selected.length===0){ setToast && setToast('অন্তত ১টি জিনিস সিলেক্ট করুন'); return; }
    const trip={
      id: editingId || Date.now().toString(),
      fromLocation: fromLoc,
      destination: toLoc,
      fromDiv, fromDist, fromUpa,
      toDiv, toDist, toUpa,
      fromDate, toDate,
      selected,
      packed: editingId ? (travelList.find(x=>x.id===editingId)?.packed || []) : [],
      travelStatus: 'Saved',
      createdAt: new Date().toISOString()
    };
    if(editingId){
      setTravelList(prev=> prev.map(x=> x.id===editingId ? trip : x));
      setToast && setToast('Trip Updated ✓');
    }else{
      setTravelList(prev=> [trip, ...prev]);
      setToast && setToast('Trip Saved ✓');
    }
    handleCancel();
    setActiveTab('saved');
  };

  const handleCancel = ()=>{
    setFromDiv(''); setFromDist(''); setFromUpa('');
    setToDiv(''); setToDist(''); setToUpa('');
    setFromDate(today()); setToDate(today());
    setSelected([]); setEditingId(null); setSearch('');
  };

  const togglePacked = (tripId, itemId)=>{
    setTravelList(prev=> prev.map(tr=>{
      if(tr.id!==tripId) return tr;
      let packed = tr.packed || [];
      if(packed.includes(itemId)) packed = packed.filter(x=>x!==itemId);
      else packed = [...packed, itemId];
      return {...tr, packed};
    }));
  };

  const markDone = (id)=>{
    setTravelList(prev=> prev.map(tr=> tr.id===id ? {...tr, travelStatus:'Travel Done'} : tr));
    setToast && setToast('Travel Done ✓');
  };

  const markUndone = (id)=>{
    setTravelList(prev=> prev.map(tr=> tr.id===id ? {...tr, travelStatus:'Saved'} : tr));
  };

  const deleteTrip = (id)=>{
    if(!confirm('Delete this trip?')) return;
    setTravelList(prev=> prev.filter(x=>x.id!==id));
    setToast && setToast('Deleted');
  };

  const loadTrip = (tr)=>{
    setFromDiv(tr.fromDiv||''); setFromDist(tr.fromDist||''); setFromUpa(tr.fromUpa||'');
    setToDiv(tr.toDiv||''); setToDist(tr.toDist||''); setToUpa(tr.toUpa||'');
    setFromDate(tr.fromDate||today()); setToDate(tr.toDate||today());
    setSelected(tr.selected||[]); setEditingId(tr.id);
    setActiveTab('new');
    window.scrollTo(0,0);
  };

  const filteredGroups = TRAVEL_GROUPS.map(g=>{
    let items=g.items;
    if(search){
      const s=search.toLowerCase();
      const filtered=items.filter(it=> it.label.toLowerCase().includes(s));
      if(filtered.length===0 && !g.name.toLowerCase().includes(s) && !g.nameEn.toLowerCase().includes(s)) return null;
      return {...g, items: filtered.length>0 ? filtered : items};
    }
    return {...g, items};
  }).filter(Boolean);

  const savedTrips = travelList.filter(tr=> tr.travelStatus!=='Travel Done');
  const doneTrips = travelList.filter(tr=> tr.travelStatus==='Travel Done');

  return h('div', {className:'bg-[#FFFEF7] -m-4 p-0 min-h-[600px]', onClick:(e)=>e.stopPropagation()},
    // TAB HEADER
    h('div', {className:'flex gap-2 p-3 bg-white border-b border-[#F3E8D3] sticky top-0 z-10'},
      h('button', {type:'button', onClick:(e)=>{ e.stopPropagation(); setActiveTab('new'); }, className:'flex-1 py-3 rounded-full text-[13px] font-extrabold transition-colors border-2 '+(activeTab==='new' ? 'bg-[#2E7D32] text-white border-[#2E7D32] shadow-md' : 'bg-white text-[#5D4037] border-[#E8E6DC]')}, 'New Trip'),
      h('button', {type:'button', onClick:(e)=>{ e.stopPropagation(); setActiveTab('saved'); }, className:'flex-1 py-3 rounded-full text-[13px] font-extrabold transition-colors border-2 relative '+(activeTab==='saved' ? 'bg-[#2E7D32] text-white border-[#2E7D32] shadow-md' : 'bg-[#FFF8E1] text-[#5D4037] border-[#FFE082]')}, 'Save Trip ('+savedTrips.length+')'),
      h('button', {type:'button', onClick:(e)=>{ e.stopPropagation(); setActiveTab('done'); }, className:'flex-1 py-3 rounded-full text-[13px] font-extrabold transition-colors border-2 '+(activeTab==='done' ? 'bg-[#2E7D32] text-white border-[#2E7D32] shadow-md' : 'bg-white text-[#5D4037] border-[#E8E6DC]')}, 'Done Trip ('+doneTrips.length+')')
    ),

    activeTab==='new' ? 
    h('div', {className:'p-4 space-y-4'},
      // FROM / TO GRID
      h('div', {className:'grid grid-cols-2 gap-3'},
        // FROM
        h('div', {className:'bg-white border border-[#F3E8D3] rounded-[16px] p-3 space-y-2'},
          h('p', {className:'text-[13px] font-extrabold text-[#1B4D3E] flex items-center gap-1'}, '🔵 From'),
          h('select', {value:fromDiv, onChange:e=>{ setFromDiv(e.target.value); setFromDist(''); setFromUpa(''); }, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold'}, h('option', {value:''}, 'বিভাগ / Division'), BD_DIVISIONS.map(d=> h('option', {key:d.id, value:d.id}, d.bn+' - '+d.en))),
          h('select', {value:fromDist, onChange:e=>{ setFromDist(e.target.value); setFromUpa(''); }, disabled:!fromDiv, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold disabled:opacity-50'}, h('option', {value:''}, 'জেলা / District'), getDistricts(fromDiv).map(d=> h('option', {key:d.id, value:d.id}, d.bn+' - '+d.en))),
          h('select', {value:fromUpa, onChange:e=>setFromUpa(e.target.value), disabled:!fromDist, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold disabled:opacity-50'}, h('option', {value:''}, 'উপজেলা / Upazila'), getUpazilas(fromDiv, fromDist).map(u=> h('option', {key:u, value:u}, u))),
          h('div', {className:'flex items-center gap-2 bg-white border border-[#E8E6DC] rounded-[12px] px-3 py-2'},
            h('span', {className:'text-[14px]'}, '📅'),
            h('input', {type:'date', value:fromDate, onChange:e=>setFromDate(e.target.value), className:'flex-1 bg-transparent text-[12px] font-bold outline-none'})
          )
        ),
        // TO
        h('div', {className:'bg-white border border-[#F3E8D3] rounded-[16px] p-3 space-y-2'},
          h('p', {className:'text-[13px] font-extrabold text-[#B71C1C] flex items-center gap-1'}, '🔴 Destination'),
          h('select', {value:toDiv, onChange:e=>{ setToDiv(e.target.value); setToDist(''); setToUpa(''); }, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold'}, h('option', {value:''}, 'বিভাগ / Division'), BD_DIVISIONS.map(d=> h('option', {key:d.id, value:d.id}, d.bn+' - '+d.en))),
          h('select', {value:toDist, onChange:e=>{ setToDist(e.target.value); setToUpa(''); }, disabled:!toDiv, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold disabled:opacity-50'}, h('option', {value:''}, 'জেলা / District'), getDistricts(toDiv).map(d=> h('option', {key:d.id, value:d.id}, d.bn+' - '+d.en))),
          h('select', {value:toUpa, onChange:e=>setToUpa(e.target.value), disabled:!toDist, className:'w-full bg-[#F9F6F0] border border-[#E8E6DC] rounded-[12px] px-3 py-2.5 text-[12px] font-bold disabled:opacity-50'}, h('option', {value:''}, 'উপজেলা / Upazila'), getUpazilas(toDiv, toDist).map(u=> h('option', {key:u, value:u}, u))),
          h('div', {className:'flex items-center gap-2 bg-white border border-[#E8E6DC] rounded-[12px] px-3 py-2'},
            h('span', {className:'text-[14px]'}, '📅'),
            h('input', {type:'date', value:toDate, onChange:e=>setToDate(e.target.value), className:'flex-1 bg-transparent text-[12px] font-bold outline-none'})
          )
        )
      ),

      // PREVIEW LINE
      (fromDiv || toDiv) ? h('div', {className:'bg-[#2E7D32] text-white rounded-[12px] p-3 text-center'},
        h('p', {className:'text-[16px] font-extrabold'}, (buildLocationString(fromDiv, fromDist, fromUpa) || '?')+' → '+(buildLocationString(toDiv, toDist, toUpa) || '?')),
        h('p', {className:'text-[11px] mt-1 opacity-90'}, formatDMY(fromDate)+' → '+formatDMY(toDate))
      ) : null,

      // ITEMS LIST
      h('div', {className:'bg-white border border-[#F3E8D3] rounded-[16px] p-3'},
        h('div', {className:'flex justify-between items-center mb-3'},
          h('p', {className:'text-[16px] font-extrabold'}, 'প্রয়োজনীয় জিনিস ('+selected.length+')'),
          h('input', {value:search, onChange:e=>setSearch(e.target.value), placeholder:'🔍 Search items...', className:'w-[50%] bg-[#F9F6F0] border border-[#E8E6DC] rounded-full px-3 py-1.5 text-[11px] outline-none'})
        ),
        h('div', {className:'space-y-2 max-h-[400px] overflow-y-auto'},
          filteredGroups.map(g=>
            h('div', {key:g.id, className:'border border-[#F3E8D3] rounded-[12px] overflow-hidden'},
              h('button', {onClick:()=>setOpenGroups(prev=>({...prev, [g.id]:!prev[g.id]})), className:'w-full flex justify-between items-center p-4 py-4 bg-[#FFFEF7]'},
                h('span', {className:'text-[21px] font-extrabold leading-tight'}, g.icon+' '+g.name+' ('+g.items.filter(it=>selected.includes(it.id)).length+'/'+g.items.length+')'),
                h('span', {className:'text-[11px]'}, openGroups[g.id] ? '▲' : '▼')
              ),
              openGroups[g.id] ? h('div', {className:'p-3 grid grid-cols-1 gap-3 bg-white'},
                g.items.map(it=>{
                  const sel=selected.includes(it.id);
                  return h('button', {key:it.id, onClick:()=>handleSelect(it.id), className:'flex items-center gap-3 p-3 py-3 rounded-[12px] border-2 text-left transition-colors mb-1 '+(sel ? 'bg-[#E8F5E9] border-[#2E7D32] text-[#1B4D3E]' : 'bg-[#FFEBEE] border-[#FFCDD2] text-[#B71C1C]')},
                    h('div', {className:'w-[28px] h-[28px] rounded-[6px] flex items-center justify-center shrink-0 '+(sel ? 'bg-[#2E7D32]' : 'bg-[#B71C1C]')}, h('span', {className:'text-white text-[14px] font-bold'}, sel ? '✓' : '✕')),
                    h('span', {className:'text-[18px]'}, it.icon),
                    h('span', {className:'text-[12px] font-extrabold flex-1 leading-relaxed py-1'}, it.label)
                  );
                }).concat(g.id==='others' ? [h('div', {key:'others-note-box', className:'mt-4 p-4 bg-[#FFF8E1] rounded-[14px] border-2 border-[#FFE082]'},
                  h('label', {className:'text-[14px] font-extrabold text-[#5D4037] mb-2 block'}, '📝 Write other travel items / notes'),
                  h('textarea', {value:othersNote||'', onChange:e=>{const v=e.target.value; if(typeof setOthersNote==='function') setOthersNote(v); try{ localStorage.setItem('travel_others_note', v); }catch(er){}}, placeholder:'e.g., Extra charger, gifts, umbrella...', className:'w-full h-[120px] p-4 rounded-[12px] border-2 border-[#E8E6DC] bg-white text-[15px] text-[#1A1A1A] placeholder-[#9A9A9A] focus:border-[#2E7D32] focus:outline-none resize-none', rows:5}),
                  h('p', {className:'text-[12px] text-[#8D6E63] mt-2'}, 'This note will be saved with your checklist')
                )] : [])
              ) : null
            )
          )
        )
      ),

      // CANCEL SAVE - Fixed bottom, both visible side by side
      h('div', {className:'flex gap-3 pb-6 pt-3 bg-[#FFFEF7] sticky bottom-0 border-t border-[#F3E8D3]/50 mt-4'},
        h('button', {onClick:function(){ handleCancel(); if(typeof onClose==='function') onClose(); }, className:'flex-1 py-4 rounded-full bg-white border-2 border-[#E8E6DC] text-[#1A1A1A] text-[17px] font-extrabold shadow-sm'}, 'Cancel'),
        h('button', {onClick:handleSave, className:'flex-1 py-4 rounded-full bg-[#2E7D32] text-white text-[17px] font-extrabold shadow-lg'}, editingId ? 'Update' : 'Save')
      )
    ) : null,

    activeTab==='saved' ?
    h('div', {className:'p-3 space-y-3'},
      savedTrips.length===0 ? h('p', {className:'text-center py-10 text-[13px] text-[#8B7355]'}, 'No saved trips. Create New Trip.') :
      savedTrips.map(tr=>{
        const total=tr.selected?.length||0;
        const packed=tr.packed?.length||0;
        const pct= total>0 ? Math.round(packed/total*100) : 0;
        return h('div', {key:tr.id, className:'bg-white border border-[#F3E8D3] rounded-[16px] p-3 shadow-sm'},
          h('div', {className:'flex justify-between items-start'},
            h('div', {className:'flex-1'},
              h('p', {className:'text-[18px] font-extrabold text-[#1A1A1A]'}, (tr.fromLocation||'?')+' → '+(tr.destination||'?')),
              h('p', {className:'text-[12px] font-bold text-[#5C4A32] mt-1'}, formatDMY(tr.fromDate)+' → '+formatDMY(tr.toDate)),
              h('div', {className:'mt-2'},
                h('div', {className:'flex justify-between text-[11px] font-bold mb-1'}, h('span', null, 'Packing Progress'), h('span', {className:'text-[#2E7D32]'}, packed+'/'+total+' ('+pct+'%)')),
                h('div', {className:'w-full h-2 bg-[#F3E8D3] rounded-full overflow-hidden'}, h('div', {className:'h-full bg-[#2E7D32] transition-all', style:{width:pct+'%'}}))
              ),
              h('div', {className:'mt-3 bg-[#FFFEF7] border border-[#F3E8D3] rounded-[12px] p-2'},
                (tr.selected||[]).map(sid=>{
                  let lbl=sid;
                  TRAVEL_GROUPS.forEach(g=>{ g.items.forEach(it=>{ if(it.id===sid) lbl=it.label; }); });
                  const isPacked = tr.packed && tr.packed.includes(sid);
                  return h('div', {key:sid, className:'flex items-center gap-2 py-2 border-b border-[#F3E8D3]/50 last:border-0 cursor-pointer '+(isPacked ? 'bg-[#E8F5E9]/50' : ''), onClick:()=>togglePacked(tr.id, sid)},
                    h('div', {className:'w-[20px] h-[20px] rounded-[5px] border-2 flex items-center justify-center shrink-0 '+(isPacked ? 'bg-[#2E7D32] border-[#2E7D32]' : 'bg-[#B71C1C]')}, isPacked ? h('span', {className:'text-white text-[13px] font-bold'}, '✓') : null),
                    h('span', {className:'text-[12px] font-medium '+(isPacked ? 'text-[#2E7D32] line-through' : 'text-[#1A1A1A]')}, lbl)
                  );
                })
              )
            ),
            h('div', {className:'flex flex-col gap-1.5 ml-2 shrink-0'},
              h('button', {onClick:()=>loadTrip(tr), className:'px-3 py-1.5 rounded-full bg-[#2E7D32] text-white text-[13px] font-bold'}, 'Edit'),
              h('button', {onClick:()=>markDone(tr.id), className:'px-3 py-1.5 rounded-full bg-[#2E7D32] text-white text-[13px] font-bold'}, 'Done'),
              h('button', {onClick:()=>deleteTrip(tr.id), className:'px-3 py-1.5 rounded-full bg-white border border-[#FFCDD2] text-[#B71C1C] text-[11px] font-bold'}, 'Del')
            )
          )
        );
      })
    ) : null,

    activeTab==='done' ?
    h('div', {className:'p-3 space-y-3'},
      doneTrips.length===0 ? h('p', {className:'text-center py-10 text-[13px] text-[#8B7355]'}, 'No done trips yet.') :
      doneTrips.map(tr=>
        h('div', {key:tr.id, className:'bg-[#E8F5E9] border border-[#A5D6A7] rounded-[16px] p-3'},
          h('p', {className:'text-[16px] font-extrabold'}, (tr.fromLocation||'?')+' → '+(tr.destination||'?')),
          h('p', {className:'text-[11px] text-[#5C4A32] mt-1'}, formatDMY(tr.fromDate)+' → '+formatDMY(tr.toDate)+' | '+ (tr.selected?.length||0)+' items'),
          h('div', {className:'flex gap-2 mt-2'},
            h('button', {onClick:()=>loadTrip(tr), className:'px-3 py-1.5 rounded-full bg-white border text-[11px] font-bold'}, 'Load Again'),
            h('button', {onClick:()=>markUndone(tr.id), className:'px-3 py-1.5 rounded-full bg-[#FFEBEE] border border-[#FFCDD2] text-[#B71C1C] text-[11px] font-bold'}, 'Undo'),
            h('button', {onClick:()=>deleteTrip(tr.id), className:'px-3 py-1.5 rounded-full bg-white border text-[11px]'}, 'Del')
          )
        )
      )
    ) : null
  );
}



window.__RoutineManagers = { DailyRoutineManager: DailyRoutineManager, TravelManager: TravelManager, MarketSurveyManager: MarketSurveyManager, BottomSheet: BottomSheet };
}
</script>

<script>
/* ---- Routine & Work opener: mounts the copied React managers as BottomSheets ---- */
var __routineRoot = null;
function openRoutineModule(type){
  try{
    if(typeof firebase === 'undefined'){
      window.firebase = { apps: [], initializeApp: function(){}, auth: function(){ return { currentUser: null }; }, firestore: undefined };
    }
  }catch(e){}
  window.__routineType = type;
  window.__routineLang = (typeof lang !== 'undefined' ? lang : 'bn');
  if(!__routineRoot){
    __routineRoot = ReactDOM.createRoot(document.getElementById('routineRoot'));
  }
  __routineRoot.render(React.createElement(RoutineSheet, { key: type + '_' + Date.now(), type: type }));
}
function closeRoutineModule(){
  if(__routineRoot){ try{ __routineRoot.render(null); }catch(e){} }
}
function RoutineSheet(props){
  var st = React.useState(''); var toast = st[0]; var setToast = st[1];
  var langNow = window.__routineLang || 'bn';
  var tProxy = new Proxy({}, { get: function(){ return ''; } });
  var M = window.__RoutineManagers;
  var title = props.type === 'daily_routine' ? (langNow==='en' ? 'Daily Routine - Add Task' : 'ডেইলি রুটিন - কাজ যোগ করুন')
    : props.type === 'travel' ? (langNow==='en' ? 'Travel Checklist' : 'ভ্রমণ চেকলিস্ট')
    : (langNow==='en' ? 'Market Survey' : 'মার্কেট সার্ভে');
  var Manager = props.type === 'daily_routine' ? M.DailyRoutineManager
    : props.type === 'travel' ? M.TravelManager : M.MarketSurveyManager;
  React.useEffect(function(){
    if(!toast) return;
    var id = setTimeout(function(){ setToast(''); }, 3000);
    return function(){ clearTimeout(id); };
  }, [toast]);
  return React.createElement('div', null,
    React.createElement(M.BottomSheet, { title: title, onClose: closeRoutineModule },
      React.createElement(Manager, { t: tProxy, lang: langNow, setToast: setToast, onClose: closeRoutineModule })
    ),
    toast ? React.createElement('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] bg-[#1A1A1A] text-white text-[13px] font-semibold px-4 py-2.5 rounded-full shadow-lg max-w-[92vw] text-center' }, toast) : null
  );
}
</script>
</body>
</html>
