<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#E3F2FD">
<title>Lifestyle</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#FFFBF7;}
  .card{background:#fff;border:1px solid #F3E8D3;border-radius:16px;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.15);margin-left:auto;margin-right:auto;} #formSheet:not(.hidden){display:flex;flex-direction:column;overflow:hidden;height:92vh;} #formSheet .formSheetBody{overflow-y:auto;flex:1;min-height:0;} @media (min-width:768px){ .sheet{ max-width:42rem; } } @media (min-width:1024px){ .sheet{ max-width:56rem; } }
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#E3F2FD;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:100;white-space:nowrap;}
  .hidden{display:none;}
  input,select,textarea{outline:none;}
  .cat-btn{border:1.5px solid #F3E8D3;border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;background:#fff;text-align:center;cursor:pointer;}
  .cat-btn.sel{background:#E3F2FD;border-color:#E3F2FD;}
  .grp-btn{border:1.5px solid #F3E8D3;border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;background:#fff;text-align:center;cursor:pointer;}
  .grp-btn.sel{background:#E3F2FD;border-color:#E3F2FD;}
  .nav-btn{flex:1;text-align:center;font-size:11px;font-weight:700;color:#8B7355;padding:8px 0 6px;cursor:pointer;}
  .nav-btn.active{color:#8B5E3C;}
  .nav-btn.active .nav-ico{color:#C9A86A;}
  #pdfPreviewBody{overflow-x:hidden;}
  .stmt-table{table-layout:fixed;width:100%;}
  .stmt-table td,.stmt-table th{overflow-wrap:break-word;}
#leBankSaveBtn:disabled{background:#A8A29E;}
</style>
</head>
<body>
<div id="app" class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto min-h-screen pb-28"></div>

<!-- Bottom Nav -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#F3E8D3]">
  <div class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto flex items-end relative">
    <div id="navHome" class="nav-btn active" onclick="navGo('home')"><div class="nav-ico text-[20px]">🏠</div><span data-t="home">HOME</span></div>
    <div id="navHistory" class="nav-btn" onclick="navGo('history')"><div class="nav-ico text-[20px]">🕘</div><span data-t="history">History</span></div>
    <div class="flex-1 flex justify-center"><button onclick="openAddSheet()" class="w-14 h-14 -mt-6 rounded-full bg-[#E3F2FD] text-[28px] font-bold shadow-lg">+</button></div>
    <div id="navReports" class="nav-btn" onclick="navGo('reports')"><div class="nav-ico text-[20px]">📊</div><span data-t="reports">Reports</span></div>
    <div id="navProfile" class="nav-btn" onclick="navGo('profile')"><div class="nav-ico text-[20px]">👤</div><span data-t="profile">Profile</span></div>
  </div>
</div>

<!-- Add New Transaction sheet -->
<div id="addSheetOverlay" class="overlay hidden" onclick="closeAddSheet()"></div>
<div id="addSheet" class="sheet hidden">
  <div class="p-5">
    <div class="flex justify-between items-center mb-4"><h2 class="text-[17px] font-extrabold" data-t="addNewTx">Add New Transaction</h2><button onclick="closeAddSheet()" class="text-xl px-2">✕</button></div>
    <button onclick="openForm('income')" class="w-full text-left py-3.5 px-4 mb-2 rounded-2xl bg-[#EAF7EA] font-bold text-[14px]">💰 <span data-t="addIncome">Add Income</span></button>
    <button onclick="openForm('expense')" class="w-full text-left py-3.5 px-4 mb-2 rounded-2xl bg-[#FDECEC] font-bold text-[14px]">💸 <span data-t="addExpense">Add Expense</span></button>
    <button onclick="closeAddSheet();openLoanEntryForm('addloan','given','')" class="w-full text-left py-3.5 px-4 mb-2 rounded-2xl bg-[#FFF8E1] font-bold text-[14px]">🤝 <span data-t="giveLoan">Give Loan</span></button>
    <button onclick="closeAddSheet();openLoanEntryForm('addloan','taken','')" class="w-full text-left py-3.5 px-4 mb-2 rounded-2xl bg-[#E3F2FD] font-bold text-[14px]">📥 <span data-t="takeLoan">Take Loan</span></button>
    <button onclick="closeAddSheet();openLoanEntryForm('addbank','bank','')" class="w-full text-left py-3.5 px-4 rounded-2xl bg-[#F3E5F5] font-bold text-[14px]">🏦 <span data-t="bankLoan">Bank Loan</span></button>
  </div>
</div>

<!-- Add Income / Expense form sheet -->
<div id="formOverlay" class="overlay hidden" onclick="closeForm()"></div>
<div id="formSheet" class="sheet hidden">
  <div class="bg-white px-5 pt-5 pb-3 shrink-0">
    <div class="flex justify-between items-center mb-4"><h2 id="formTitle" class="text-[17px] font-extrabold">Add Income</h2><button onclick="closeForm()" class="text-xl px-2">✕</button></div>
    <div id="selCatBox" class="hidden mb-3 p-3 rounded-xl bg-[#FFFBF7] border border-[#F3E8D3] flex justify-between items-center"><div><div class="text-[11px] text-[#8B7355]" data-t="selectedCat">Selected Category</div><div id="selCatLabel" class="font-bold text-[14px]"></div></div><button onclick="clearCat()" class="px-2 text-[#8B7355]">✕</button></div>
    <div class="flex gap-2 mb-4">
      <button id="saveBtn" onclick="saveForm()" class="flex-1 py-3 rounded-full bg-[#E3F2FD] font-bold text-[14px]">Save</button>
      <button onclick="closeForm()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="amount">Amount (৳)</label>
    <input id="fAmount" oninput="updateSaveBtn()" type="number" inputmode="decimal" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[16px] mt-1">
    <div class="flex items-center gap-2 mt-1 mb-2">
      <label class="text-[12px] font-bold text-[#8B7355] shrink-0" data-t="category">Category</label>
      <div class="flex-1 flex items-center gap-1 bg-white border border-[#F3E8D3] rounded-full px-3 py-1.5">
        <span class="text-[13px]">🔍</span>
        <input id="catSearch" type="text" placeholder="" oninput="setCatSearch(this.value)" class="flex-1 text-[13px] bg-transparent" style="min-width:0">
        <button id="catSearchClear" onclick="clearCatSearch()" class="text-[#8B7355] text-[14px] px-1" style="visibility:hidden">✕</button>
      </div>
    </div>
  </div>
  <div class="formSheetBody px-5 pb-5">
    <div id="catArea" class="mt-1 mb-3"></div>
    <div class="flex gap-3 mb-3">
      <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="date">Date</label><input id="fDate" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1"></div>
      <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="medium">Medium</label><select id="fMedium" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1"></select></div>
    </div>
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="note">Note</label>
    <textarea id="fNote" rows="2" maxlength="500" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1"></textarea>
  </div>
</div>

<div id="bazarOverlay" class="overlay hidden" onclick="closeBazar()"></div>
<div id="bazarSheet" class="sheet hidden">
  <div class="p-5">
    <div class="flex justify-between items-center mb-4"><h2 class="text-[17px] font-extrabold" data-t="bazarTitle">Bazar</h2><button onclick="closeBazar()" class="text-xl px-2">✕</button></div>
    <div class="flex gap-2 mb-3">
      <button id="bzTabAll" onclick="setBazarFilter('all')" class="px-3 py-1.5 rounded-full text-[12px] font-bold bg-[#E3F2FD]" data-t="allLbl">All</button>
      <button id="bzTabBought" onclick="setBazarFilter('bought')" class="px-3 py-1.5 rounded-full text-[12px] font-bold bg-white border border-[#F3E8D3]" data-t="bought">Bought</button>
      <button id="bzTabPending" onclick="setBazarFilter('pending')" class="px-3 py-1.5 rounded-full text-[12px] font-bold bg-white border border-[#F3E8D3]" data-t="notBought">Not Bought</button>
    </div>
    <div class="flex gap-2 mb-4">
      <textarea id="bzNoteInput" rows="2" maxlength="500" class="flex-1 bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px]" style="min-width:0"></textarea>
      <button onclick="addBazarNote()" class="px-4 py-3 rounded-[14px] bg-[#E3F2FD] font-bold text-[14px] shrink-0" data-t="addNote">Add Note</button>
    </div>
    <div id="bazarList"></div>
  </div>
</div>

<!-- Bazar buy / edit form -->
<div id="bazarFormOverlay" class="overlay hidden" onclick="closeBazarForm()"></div>
<div id="bazarFormSheet" class="sheet hidden">
  <div class="p-5">
    <div class="flex justify-between items-center mb-4"><h2 id="bzFormTitle" class="text-[17px] font-extrabold">Bought</h2><button onclick="closeBazarForm()" class="text-xl px-2">✕</button></div>
    <div id="bzSelCatBox" class="hidden mb-3 p-3 rounded-xl bg-[#FFFBF7] border border-[#F3E8D3] flex justify-between items-center"><div><div class="text-[11px] text-[#8B7355]" data-t="selectedCat">Selected Category</div><div id="bzSelCatLabel" class="font-bold text-[14px]"></div></div><button onclick="clearBzCat()" class="px-2 text-[#8B7355]">✕</button></div>
    <div id="bzFormNote" class="hidden mb-3 p-3 rounded-xl bg-[#FFF8E1] text-[12px] text-[#8B7355]" data-t="boughtNote"></div>
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="itemLbl">Item</label>
    <input id="bzText" type="text" maxlength="200" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3">
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="priceLbl">Price</label>
    <input id="bzPrice" type="number" inputmode="decimal" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3">
    <div class="flex items-center gap-2 mt-1 mb-2">
      <label class="text-[12px] font-bold text-[#8B7355] shrink-0" data-t="category">Category</label>
      <div class="flex-1 flex items-center gap-1 bg-white border border-[#F3E8D3] rounded-full px-3 py-1.5">
        <span class="text-[13px]">🔍</span>
        <input id="bzCatSearch" type="text" placeholder="" oninput="setBzCatSearch(this.value)" class="flex-1 text-[13px] bg-transparent" style="min-width:0">
        <button id="bzCatSearchClear" onclick="clearBzCatSearch()" class="hidden text-[#8B7355] text-[14px] px-1">✕</button>
      </div>
    </div>
    <div id="bzCatArea" class="mt-1 mb-3 max-h-[200px] overflow-y-auto"></div>
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="date">Date</label>
    <input id="bzDate" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3">
    <div class="flex gap-2">
      <button onclick="saveBazarForm()" class="flex-1 py-3 rounded-full bg-[#E3F2FD] font-bold text-[14px]">Save</button>
      <button onclick="closeBazarForm()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- History: PDF Preview -->
<div id="pdfOverlay" class="overlay hidden" onclick="closePdfPreview()"></div>
<div id="pdfPreviewSheet" class="sheet hidden">
  <div class="sticky top-0 z-10 bg-white px-5 pt-5 pb-3">
    <div class="flex justify-between items-center mb-3"><h2 class="text-[17px] font-extrabold">PDF Preview</h2><button onclick="closePdfPreview()" class="text-xl px-2">✕</button></div>
  </div>
  <div class="px-5 pb-5">
    <div id="pdfPreviewBody" style="overflow-x:auto;touch-action:pan-x pan-y"></div>
    <!-- View = preview only: no Print / Share / Excel buttons here (those live on the main page) -->
  </div>
</div>

<!-- History: Loan Entry Edit -->
<div id="loanEditOverlay" class="overlay hidden" onclick="closeLoanEntryForm()"></div>
<div id="loanEditSheet" class="sheet hidden">
  <div class="p-5">
    <div class="flex justify-between items-center mb-4"><h2 id="leTitle" class="text-[17px] font-extrabold">Edit Loan Entry</h2><button onclick="closeLoanEntryForm()" class="text-xl px-2">✕</button></div>
    <div id="leBankTop" class="hidden flex gap-2 mb-3">
      <button id="leBankSaveBtn" onclick="saveLoanEntry()" class="flex-1 py-3 rounded-full bg-[#E3F2FD] font-bold text-[14px]" data-t="saveLoan">Save Loan</button>
      <button onclick="closeLoanEntryForm()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
    <div id="lePersonTop" class="hidden flex gap-2 mb-3">
      <button id="lePersonSaveBtn" onclick="saveLoanEntry()" class="flex-1 py-3 rounded-full bg-[#9E9E9E] font-bold text-[14px]" disabled>Save Loan</button>
      <button onclick="closeLoanEntryForm()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
    <div id="lePersonFields">
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="nameLbl">Name</label>
      <div class="flex gap-2 items-center mt-1 mb-3">
        <input id="lePersonName" type="text" maxlength="80" placeholder="New person name" oninput="updatePersonSaveBtn()" class="flex-1 min-w-0 bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px]">
        <button onclick="pickFromPhoneContacts()" class="w-[46px] h-[46px] shrink-0 rounded-full border border-[#F3E8D3] bg-white text-[20px] flex items-center justify-center" title="Contacts">📒</button>
      </div>
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="mobileContactLbl">Mobile / Contact Number</label>
      <div class="flex gap-2 items-center mt-1 mb-3">
        <input id="lePersonMobile" type="tel" maxlength="20" placeholder="Type manually or pick from contacts" class="flex-1 min-w-0 bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px]">
        <button onclick="pickFromPhoneContacts()" class="w-[46px] h-[46px] shrink-0 rounded-full border border-[#F3E8D3] bg-white text-[20px] flex items-center justify-center" title="Contacts">📞</button>
      </div>
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="amount">Amount (৳)</label>
      <input id="leAmount" oninput="updatePersonSaveBtn()" type="number" inputmode="decimal" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[16px] mt-1 mb-3">
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="date">Date</label>
      <input id="leDate" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3">
      <div class="flex gap-2">
        <div class="flex-1 min-w-0"><label class="text-[12px] font-bold text-[#8B7355]" data-t="fromChannelLbl">From Channel</label>
        <select id="leFromChannel" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3"></select></div>
        <div class="flex-1 min-w-0"><label class="text-[12px] font-bold text-[#8B7355]" data-t="toChannelLbl">To Channel</label>
        <select id="leToChannel" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3"></select></div>
      </div>
      <div id="leExpectedReturnRow">
        <label class="text-[12px] font-bold text-[#8B7355]" data-t="expectedReturnLbl">Expected Return Date</label>
        <input id="leExpectedReturn" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3">
      </div>
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="note">Note</label>
      <textarea id="leNote" rows="3" maxlength="500" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3"></textarea>
    </div>
    <div id="leBankFields" class="hidden">
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="bankNameLbl">Bank Name</label>
      <select id="leBank" onchange="renderBankEmiSheet()" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3"></select>
      <div class="flex gap-2">
        <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="loanAmountLbl">Loan Amount</label>
        <input id="leBankAmount" oninput="renderBankEmiSheet()" type="number" inputmode="decimal" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3"></div>
        <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="termLbl">Term (months)</label>
        <input id="leMonths" oninput="renderBankEmiSheet()" type="number" inputmode="numeric" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3"></div>
      </div>
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="rateLbl">Interest Rate %</label>
      <input id="leRate" oninput="renderBankEmiSheet()" type="number" inputmode="decimal" placeholder="0" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3">
      <div class="flex gap-2">
        <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="disbursementLbl">Disbursement Date</label>
        <input id="leDisbursement" oninput="renderBankEmiSheet()" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3"></div>
        <div class="flex-1"><label class="text-[12px] font-bold text-[#8B7355]" data-t="emiStartLbl">EMI Start Date</label>
        <input id="leEmiStart" oninput="renderBankEmiSheet()" type="date" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3"></div>
      </div>
      <label class="text-[12px] font-bold text-[#8B7355]" data-t="emiEndLbl">EMI End Date (auto)</label>
      <input id="leEmiEnd" type="date" readonly class="w-full bg-[#F5EEDD] border border-[#F3E8D3] rounded-[14px] px-3 py-3 text-[14px] mt-1 mb-3">
    </div>
    <div id="leEmiWrap" class="hidden">
      <div class="flex justify-between items-center mt-1 mb-2">
        <span class="text-[14px] font-bold">EMI Sheet</span>
        <span id="leEmiPaidCount" class="text-[12px] text-[#8B7355]">0/0 Paid</span>
      </div>
      <div id="leEmiSheet" class="border border-[#F3E8D3] rounded-[14px] overflow-hidden mb-3"></div>
    </div>
    <div id="leBottomBtns" class="hidden flex gap-2">
      <button onclick="saveLoanEntry()" class="flex-1 py-3 rounded-full bg-[#E3F2FD] font-bold text-[14px]">Save</button>
      <button onclick="closeLoanEntryForm()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Bank Loan: EMI Checklist -->
<div id="emiOverlay" class="overlay hidden" onclick="closeEmiChecklist()"></div>
<div id="emiSheet" class="sheet hidden">
  <div class="sticky top-0 z-10 bg-white px-5 pt-5 pb-3">
    <div class="flex justify-between items-center mb-4"><h2 id="emiTitle" class="text-[17px] font-extrabold">EMI Checklist</h2><button onclick="closeEmiChecklist()" class="text-xl px-2">✕</button></div>
    <div class="flex gap-2 mb-4">
      <button id="emiSaveBtn" onclick="saveEmiChecklist()" class="flex-1 py-3 rounded-full bg-[#E3F2FD] font-bold text-[14px]" data-t="save">Save</button>
      <button onclick="closeEmiChecklist()" class="flex-1 py-3 rounded-full border-2 border-[#F3E8D3] font-bold text-[14px]" data-t="cancel">Cancel</button>
    </div>
    <div id="emiSummary"></div>
    <div class="flex justify-between items-center mt-1 mb-2">
      <span class="text-[14px] font-bold">EMI Sheet</span>
      <span id="emiPaidCount" class="text-[12px] text-[#8B7355]">0/0 Paid</span>
    </div>
  </div>
  <div class="px-5 pb-5">
    <div id="emiList" class="border border-[#F3E8D3] rounded-[14px] overflow-hidden"></div>
  </div>
</div>

<!-- Phase 3: Add Person -->
<div id="personOverlay" class="overlay hidden" onclick="closeAddPerson()"></div>
<div id="personSheet" class="sheet hidden">
  <div class="p-5">
    <div class="flex justify-between items-center mb-4"><h2 id="psTitle" class="text-[17px] font-extrabold">Add Person</h2><button onclick="closeAddPerson()" class="text-xl px-2">✕</button></div>
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="personName">Person name</label>
    <input id="psName" type="text" maxlength="80" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3">
    <label class="text-[12px] font-bold text-[#8B7355]" data-t="mobileNo">Mobile number</label>
    <input id="psMobile" type="tel" maxlength="20" class="w-full bg-white border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] mt-1 mb-3">
    <div class="flex gap-2">

function saveTransaction(tx){
  if(!tx.date) tx.date = today();
  if(!tx.amount || isNaN(tx.amount)) tx.amount = 0;
  tx = Object.assign({}, tx, { updatedAt: new Date().toISOString() }); // stamp: merges can tell newer from older
  const exists = state.transactions.some(x => x.id === tx.id);
  state.transactions = exists ? state.transactions.map(x => x.id === tx.id ? tx : x) : [tx, ...state.transactions];
  persist();
  render();
  showToast(t('saved'));
}

function mergeById(localArr, cloudArr){
  const map = new Map();
  (cloudArr || []).forEach(it => { if(it && it.id) map.set(it.id, it); });
  (localArr || []).forEach(it => {
    if(!it || !it.id) return;
    const prev = map.get(it.id);
    if(!prev){ map.set(it.id, it); return; }
    const a = Date.parse(prev.updatedAt || '') || 0, b = Date.parse(it.updatedAt || '') || 0;
    if(b >= a) map.set(it.id, it); // newer wins; tie -> local wins
  });
  return Array.from(map.values());
}

function markDeleted(id){

  if(!state.deleted.some(d => d.id === id)) state.deleted.push({ id: id, at: new Date().toISOString() });
}
function ensureIds(persistNow){
  let changed = false;
  const give = it => {
    if(!it) return;
    if(!it.id){ it.id = uid(); changed = true; }
    if(!it.updatedAt){ it.updatedAt = new Date().toISOString(); changed = true; }
  };
  (state.peopleGiven || []).forEach(pr => { give(pr); (pr.loans || []).forEach(give); (pr.payments || []).forEach(give); });
  (state.peopleTaken || []).forEach(pr => { give(pr); (pr.loans || []).forEach(give); (pr.payments || []).forEach(give); });
  (state.bankLoans || []).forEach(give);
  (state.transactions || []).forEach(give);
  (bazar || []).forEach(give);
  if(changed && persistNow !== false) persist();
  return changed;
}

    const cp = (cloudPeople || []).find(x => x && x.id === lp.id);

function mergeCloudState(local, cloud){

    getRestoreIds().forEach(id => del.delete(id));
  const dropDeleted = arr => (arr || []).filter(it => it && it.id && !del.has(it.id));
  const merged = {
    transactions: dropDeleted(mergeById(local.transactions || [], cloud.transactions || [])),
    peopleGiven: dropDeleted(mergePeople(local.peopleGiven || [], cloud.peopleGiven || [])),
    peopleTaken: dropDeleted(mergePeople(local.peopleTaken || [], cloud.peopleTaken || [])),
    bankLoans: dropDeleted(mergeById(local.bankLoans || [], cloud.bankLoans || [])),

let cloudBusy = false, firebaseReady = null;
function loadFirebaseSDK(){
  if(firebaseReady) return firebaseReady;
  firebaseReady = new Promise((resolve, reject) => {
    if(typeof firebase !== 'undefined' && firebase.firestore){ resolve(); return; }
    const urls = [
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'
    ];
    let i = 0;
    const next = () => {
      if(i >= urls.length){ resolve(); return; }
      const sc = document.createElement('script');
      sc.src = urls[i++];
      sc.onload = next;
      sc.onerror = () => reject(new Error('sdk'));
      document.head.appendChild(sc);
    };
    next();
  });
  return firebaseReady;
}
async function cloudConnect(){
  const cfg = cloudCfg();

let repFrom = '', repTo = '';
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function repRange(){ const d = new Date(); const f = new Date(d.getFullYear(), d.getMonth(), 1); return { from: repFrom || ymd(f), to: repTo || ymd(d) }; }
function setRepFrom(v){ repFrom = v || ''; render(); }
function setRepTo(v){ repTo = v || ''; render(); }
function shiftRange(from, to, kind){
  const f = new Date(from + 'T00:00:00'), t2 = new Date(to + 'T00:00:00');
  if(kind === 'week'){ f.setDate(f.getDate() - 7); t2.setDate(t2.getDate() - 7); }
  else if(kind === 'month'){ f.setMonth(f.getMonth() - 1); t2.setMonth(t2.getMonth() - 1); }
  else if(kind === 'year'){ f.setFullYear(f.getFullYear() - 1); t2.setFullYear(t2.getFullYear() - 1); }
  return { from: ymd(f), to: ymd(t2) };
}
function catTotalsIn(from, to){
  const m = {};
  (state.transactions || []).filter(x => x.type === 'expense' && x.date >= from && x.date <= to).forEach(x => {
    const k = x.category || '';
    if(!m[k]) m[k] = { en: k, bn: x.categoryBn || k, amt: 0 };
    m[k].amt += (+x.amount || 0);
  });
  return m;
}
function pctChange(cur, prev){ if(!prev) return cur > 0 ? 100 : 0; return Math.round((cur - prev) / prev * 100); }
function reportsData(){
  const r = repRange();
  const tx = (state.transactions || []).filter(x => x.date >= r.from && x.date <= r.to);
  const income = tx.filter(x => x.type === 'income').reduce((s, x) => s + (+x.amount || 0), 0);
  const expense = tx.filter(x => x.type === 'expense').reduce((s, x) => s + (+x.amount || 0), 0);
  const cats = catTotalsIn(r.from, r.to);
  const w = shiftRange(r.from, r.to, 'week'), mo = shiftRange(r.from, r.to, 'month'), y = shiftRange(r.from, r.to, 'year');
  const wCats = catTotalsIn(w.from, w.to), mCats = catTotalsIn(mo.from, mo.to), yCats = catTotalsIn(y.from, y.to);
  const mk = (m, k, amt) => { const prev = (m[k] && m[k].amt) || 0; return { amt: prev, pct: pctChange(amt, prev) }; };
  const list = Object.keys(cats).map(k => {
    const c = cats[k];
    return { name: lang === 'en' ? c.en : (c.bn || c.en), amt: c.amt, pct: expense ? Math.round(c.amt / expense * 100) : 0, week: mk(wCats, k, c.amt), month: mk(mCats, k, c.amt), year: mk(yCats, k, c.amt) };
  }).sort((a, b) => b.amt - a.amt);
  return { from: r.from, to: r.to, income: income, expense: expense, balance: income - expense, list: list };
}

/* ---------- Home render ---------- */
function totals(){
  const td = today(), mk = thisMonth();
  const tx = state.transactions || [];
  const tIn = tx.filter(x => x.type === 'income' && normDate(x.date) === td).reduce((s,x) => s + (+x.amount || 0), 0);
  const tEx = tx.filter(x => x.type === 'expense' && normDate(x.date) === td).reduce((s,x) => s + (+x.amount || 0), 0);
  const mIn = tx.filter(x => x.type === 'income' && normDate(x.date).startsWith(mk)).reduce((s,x) => s + (+x.amount || 0), 0);
  const mEx = tx.filter(x => x.type === 'expense' && normDate(x.date).startsWith(mk)).reduce((s,x) => s + (+x.amount || 0), 0);
  const given = (state.peopleGiven || []).reduce((s,p) => s + (p.loans || []).reduce((a,l) => a + (+l.amount || 0), 0), 0);
  const returned = (state.peopleGiven || []).reduce((s,p) => s + (p.payments || []).reduce((a,l) => a + (+l.amount || 0), 0), 0);
  const taken = (state.peopleTaken || []).reduce((s,p) => s + (p.loans || []).reduce((a,l) => a + (+l.amount || 0), 0), 0);
  const repaid = (state.peopleTaken || []).reduce((s,p) => s + (p.payments || []).reduce((a,l) => a + (+l.amount || 0), 0), 0);
  return { tIn, tEx, mIn, mEx, given, returned, taken, repaid };
}
/* ---------- View persistence: stay on the same tab after refresh ---------- */
const VIEW_STATE_KEY = 'lifestyle_view_state';
function saveViewState(){
  try{
    localStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      v: currentView, lk: loansKind, pk: personKind, pi: personIdx,
      hf: histFilter, hs: histSearch, hfr: histFrom, hto: histTo, hc: histCat,
      ls: loansSearch, lfr: loansFrom, lto: loansTo, pfr: personFrom, pto: personTo,
      hbf: homeBankFrom, hbt: homeBankTo, cd: catDetail
    }));
  }catch(e){}
}
function restoreViewState(){
  let r = null;
  try{ r = JSON.parse(localStorage.getItem(VIEW_STATE_KEY) || 'null'); }catch(e){ r = null; }
  if(!r || typeof r !== 'object') return;
  // Refresh keeps the current page; fresh app entry always starts on Home.
  let navType = '';
  try{ navType = (performance.getEntriesByType('navigation')[0] || {}).type; }catch(e){}
  if(!navType && performance.navigation) navType = performance.navigation.type;
  const isReload = navType === 'reload' || navType === 'back_forward' || navType === 1 || navType === 2;
  if(isReload){
    const views = ['home','history','catdetail','loans','person','profile','reports'];
    if(views.includes(r.v)) currentView = r.v;
  }
  if(['given','taken','bank'].includes(r.lk)) loansKind = r.lk;
  if(['given','taken'].includes(r.pk)) personKind = r.pk;
  if(typeof r.pi === 'number' && r.pi >= 0) personIdx = Math.floor(r.pi);
  if(typeof r.hf === 'string' && r.hf) histFilter = r.hf;
  if(typeof r.hs === 'string') histSearch = r.hs;
  if(typeof r.hfr === 'string' && r.hfr) histFrom = r.hfr;
  if(typeof r.hto === 'string' && r.hto) histTo = r.hto;
  if(typeof r.hc === 'string') histCat = r.hc;
  if(typeof r.ls === 'string') loansSearch = r.ls;
  if(typeof r.lfr === 'string' && r.lfr) loansFrom = r.lfr;
  if(typeof r.lto === 'string' && r.lto) loansTo = r.lto;
  if(typeof r.pfr === 'string' && r.pfr) personFrom = r.pfr;
  if(typeof r.pto === 'string' && r.pto) personTo = r.pto;
  if(typeof r.hbf === 'string' && r.hbf) homeBankFrom = r.hbf;
  if(typeof r.hbt === 'string' && r.hbt) homeBankTo = r.hbt;
  if(r.cd && typeof r.cd === 'object' && r.cd.catEn) catDetail = { catEn: r.cd.catEn || '', catBn: r.cd.catBn || '', type: r.cd.type === 'income' ? 'income' : 'expense', icon: r.cd.icon || '' };
  if(currentView === 'person'){
    const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
    if(!arr.length){ currentView = 'loans'; loansKind = personKind; }
    else if(personIdx >= arr.length) personIdx = arr.length - 1;
  }
  if(currentView === 'catdetail' && !catDetail) currentView = 'history';
  if(currentView === 'catdetail') setNavActive('history');
  else if(['home','history','profile','reports'].includes(currentView)) setNavActive(currentView);
  else setNavActive('');
}

}

function catNorm(x){ return (x || '').toLowerCase().normalize('NFC'); }
function catMatches(en, bn){
  if(!catSearch) return true;
  const q = catNorm(catSearch);
  return catNorm(en).includes(q) || catNorm(bn).includes(q);
}
function catScore(en, bn){
  if(!catSearch) return 0;
  const q = catNorm(catSearch);
  const e = catNorm(en), b = catNorm(bn);
  if(e === q || b === q) return 0;
  if(e.startsWith(q) || b.startsWith(q)) return 1;
  return 2;
}

function bazarKnownWords(){
  const set = new Set(BAZAR_EXTRA_WORDS);
  EXPENSE_FLAT.forEach(it => {
    [it.bn, it.en].forEach(n => {
      const w = (n || '').trim().toLowerCase();
      if(w && !/\s/.test(w)) set.add(w); /* single-word items only */
    });
  });
  return set;
}
function splitBazarText(raw){
  const known = bazarKnownWords();
  const out = [];
  raw.split(/[\n,\u060C\u3001]+/).forEach(chunk => {
    const t = chunk.trim();
    if(!t) return;
    const words = t.split(/\s+/).filter(Boolean);
    if(words.length > 1 && words.every(w => known.has(w.toLowerCase()))){
      words.forEach(w => out.push(w));
    } else {
      out.push(t);
    }
  });
  return out;
}

function saveBazarForm(){
  const it = bazar.find(x => x.id === bazarFormId);
  if(!it) return;
  const text = document.getElementById('bzText').value.trim() || it.text;
  const price = parseFloat(document.getElementById('bzPrice').value) || 0;
  const date = document.getElementById('bzDate').value || today();
  if(bazarFormMode === 'buy'){
    /* Gate: NO save until price + category are selected */
    if(!price || price <= 0 || bzCatIdx === null){ showToast(t('needPriceCat')); return; }
    const cat = EXPENSE_FLAT[bzCatIdx];
    const existingTx = (it.status === 'bought' && it.expenseId) ? state.transactions.find(tx => tx.id === it.expenseId) : null;
    if(existingTx){
      /* Already bought: Yes again just corrects the same expense entry, never a duplicate */
      existingTx.amount = price; existingTx.category = cat.en; existingTx.categoryBn = cat.bn; existingTx.icon = cat.icon;
      existingTx.date = date; existingTx.note = text; existingTx.updatedAt = new Date().toISOString();
      it.text = text; it.price = price; it.catIdx = bzCatIdx; it.date = date;
      it.updatedAt = new Date().toISOString();
      saveBazar();
      flashSaved(document.querySelector('button[onclick="saveBazarForm()"]'), () => { closeBazarForm(); showToast(t('saved')); });
      return;
    }
    const tx = {
      id: uid(), type: 'expense', amount: price, category: cat.en, categoryBn: cat.bn, icon: cat.icon,
      date: date, note: text, medium: 'Cash', channel: 'Cash', fromChannel: 'Cash', toChannel: 'Cash', fromMedium: 'Cash', toMedium: 'Cash'
    };
    saveTransaction(tx); /* single save path: expense totals + History update */
    it.status = 'bought';
    it.expenseId = tx.id;
    it.text = text; it.price = price; it.catIdx = bzCatIdx; it.date = date;
    it.updatedAt = new Date().toISOString();
    saveBazar();
    flashSaved(document.querySelector('button[onclick="saveBazarForm()"]'), () => { closeBazarForm(); showToast(t('addedToExpense')); });
  } else {
    /* Edit: changes only the bazar item. A bought item's expense entry stays as recorded. */
    it.text = text;
    it.price = price || null;
    it.catIdx = bzCatIdx;
    it.date = date;
    it.updatedAt = new Date().toISOString();
    saveBazar();
    flashSaved(document.querySelector('button[onclick="saveBazarForm()"]'), () => { closeBazarForm(); showToast(t('saved')); });
  }
}
function bazarNo(id){
  const it = bazar.find(x => x.id === id);
  if(!it) return;
  if(it.status === 'bought' && it.expenseId){
    /* Undo the Yes: remove the expense entry this item created, so expense totals drop back */
    markDeleted(it.expenseId);
    state.transactions = state.transactions.filter(tx => tx.id !== it.expenseId);
    it.expenseId = null;
    it.status = 'pending';
    it.updatedAt = new Date().toISOString();
    saveBazar();
    showToast(t('movedBack'));
    return;
  }
  it.status = 'pending';
  it.updatedAt = new Date().toISOString();
  saveBazar();
  showToast(t('notBoughtYet'));
}

    rows.push({ key: kind + ':' + pi + ':' + (isPayment ? 'p' : 'l') + ':' + ei, kind: kind, title: personName || '', icon: kind === 'bank' ? '🏦' : '👤', date: entry.date || '', medium: entry.medium || entry.channel || entry.fromChannel || '', note: entry.note || '', amount: +entry.amount || 0, sign: -1, personIdx: pi, entryIdx: ei, isPayment: isPayment, bankName: entry.bank || entry.name || '', updatedAt: entry.updatedAt || '' });
  };
  (state.peopleGiven || []).forEach((p, pi) => { (p.loans || []).forEach((e, ei) => pushLoan('given', p.name, e, pi, ei, false)); (p.payments || []).forEach((e, ei) => pushLoan('return', p.name, e, pi, ei, true)); });
  (state.peopleTaken || []).forEach((p, pi) => { (p.loans || []).forEach((e, ei) => pushLoan('taken', p.name, e, pi, ei, false)); (p.payments || []).forEach((e, ei) => pushLoan('repayment', p.name, e, pi, ei, true)); });
  (state.bankLoans || []).forEach((e, ei) => pushLoan('bank', e.bank || e.name || t('fBank'), e, 0, ei, false));
  rows.sort((a, b) => (normDate(b.date) || '').localeCompare(normDate(a.date) || '') || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  return rows;
}

/* ---------- Bank Loan EMI schedule ---------- */
function addMonths(ds, n){
  const d = new Date(normDate(ds) + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function calcEmi(P, rate, months){
  P = +P || 0; rate = +rate || 0; months = Math.floor(+months || 0);
  if(P <= 0 || months <= 0) return 0;
  if(rate <= 0) return P / months;
  const r = rate / 100 / 12;
  const f = Math.pow(1 + r, months);
  return P * r * f / (f - 1);
}
function normalizeEmiPaid(arr, months){
  const out = Array.isArray(arr) ? arr.slice(0, months) : [];
  while(out.length < months) out.push(false);
  return out.map(v => !!v);
}
function bankEmiSchedule(entry){
  const months = Math.floor(+(entry.months || 0));
  if(months <= 0) return [];
  const emi = Math.round(calcEmi(entry.amount, entry.rate, months));
  const paid = normalizeEmiPaid(entry.emiPaid, months);
  const rows = [];
  for(let i = 0; i < months; i++){
    rows.push({ sl: i + 1, date: addMonths(entry.emiStart || entry.date || today(), i), emi: emi, paid: !!paid[i] });
  }
  return rows;
}
function emiTableHtml(entry, toggleFn){
  const rows = bankEmiSchedule(entry);
  if(!rows.length) return { html: '<div class="text-[12px] text-[#8B7355] text-center py-3">—</div>', paid: 0, total: 0 };
  const html = '<table class="w-full text-[13px]">' +
    '<thead><tr class="text-left text-[#8B5E3C]"><th class="px-2 py-2 font-bold">SL No</th><th class="px-2 py-2 font-bold">Date</th><th class="px-2 py-2 font-bold text-right">EMI</th><th class="px-2 py-2 font-bold text-center">Paid</th></tr></thead>' +
    '<tbody>' + rows.map(r =>
      '<tr class="' + (r.paid ? 'bg-[#EAF7EE]' : 'bg-[#FFF0F0]') + ' border-t border-[#F3E8D3]">' +
      '<td class="px-2 py-2">' + r.sl + '</td>' +
      '<td class="px-2 py-2">' + r.date + '</td>' +
      '<td class="px-2 py-2 text-right font-bold">' + fmt(r.emi) + '</td>' +
      '<td class="px-2 py-2 text-center"><input type="checkbox" ' + (r.paid ? 'checked' : '') + ' onchange="' + toggleFn + '(' + (r.sl - 1) + ')" class="w-5 h-5 accent-[#C0392B]"></td>' +
      '</tr>').join('') + '</tbody></table>';
  return { html: html, paid: rows.filter(r => r.paid).length, total: rows.length };
}

function deleteLoanEntry(key){
  const r = loanEntryByKey(key);
  if(!r.entry) return;
  if(!confirmTwice(t('confirmDeleteTx'))) return;
  markDeleted(r.entry && r.entry.id);
  if(r.kind === 'bank'){ state.bankLoans = (state.bankLoans || []).filter((e, i) => i !== r.ei); }
  else {
    const arr = r.kind === 'given' || r.kind === 'return' ? state.peopleGiven : state.peopleTaken;
    const person = (arr || [])[r.pi];
    if(person){ if(r.lp === 'p') person.payments = (person.payments || []).filter((e, i) => i !== r.ei); else person.loans = (person.loans || []).filter((e, i) => i !== r.ei); }
  }
  persist();
  render();
  showToast(t('deletedTx'));
}

/* ---------- Statement format: matches the user's original Lifestyle statement PDF ---------- */
function fmtDMY(iso){
  const d = normDate(iso || '');
  if(!d) return '';
  const p = d.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function fmtDownloadNow(){
  const n = new Date();
  const dd = String(n.getDate()).padStart(2,'0'), mm = String(n.getMonth()+1).padStart(2,'0'), yy = n.getFullYear();
  let h = n.getHours(); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return dd + '/' + mm + '/' + yy + ' ' + String(h).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0') + ':' + String(n.getSeconds()).padStart(2,'0') + ' ' + ampm;
}
function statementFilterName(){
  return { all:'All', income:'Income', expense:'Expense', given:'Given', taken:'Taken', return:'Return', repayment:'Repayment', bank:'Bank Loan' }[histFilter] || 'All';
}
function statementPeriod(fromISO, toISO, rows){
  let from = fromISO || '', to = toISO || '';
  if(!from || !to){
    const dates = (rows || []).map(r => normDate(r.date || '')).filter(Boolean).sort();
    if(dates.length){ if(!from) from = dates[0]; if(!to) to = dates[dates.length - 1]; }
  }
  return { from: fmtDMY(from) || '…', to: fmtDMY(to) || '…' };
}

function personStatementRows(){
  const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  const person = arr[personIdx] || { name: '', loans: [], payments: [] };
  const rows = [];
  (person.loans || []).forEach(e => rows.push({ date: e.date || '', person: person.name || '', category: 'Loan', note: e.note || '', from: e.medium || '', to: e.medium || '', amount: -(+(e.amount || 0)) }));
  (person.payments || []).forEach(e => rows.push({ date: e.date || '', person: person.name || '', category: 'Payment', note: e.note || '', from: e.medium || '', to: e.medium || '', amount: +(e.amount || 0) }));
  rows.sort((a, b) => (normDate(a.date) < normDate(b.date) ? -1 : normDate(a.date) > normDate(b.date) ? 1 : 0));
  return rows;
}

let pdfZoom = 1; // 1 = fit-width (100%)
function pdfZoomIn(){ pdfZoom = Math.min(3, pdfZoom + 0.25); fitStatementPreview(); }
function pdfZoomOut(){ pdfZoom = Math.max(0.5, pdfZoom - 0.25); fitStatementPreview(); }
function pdfZoomReset(){ pdfZoom = 1; fitStatementPreview(); }
let stmtPinchBound = false, pinching = false, pinchStartDist = 0, pinchStartZoom = 1;
function pdfPinchStart(e){
  if(e.touches.length === 2){
    pinching = true;
    pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinchStartZoom = pdfZoom;
  }
}
function pdfPinchMove(e){
  if(!pinching || e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if(pinchStartDist > 0){
    pdfZoom = Math.min(3, Math.max(0.5, pinchStartZoom * d / pinchStartDist));
    fitStatementPreview();
  }
  e.preventDefault();
}
function pdfPinchEnd(e){
  if(e.touches.length < 2){ pinching = false; pinchStartDist = 0; }
}
function fitStatementPreview(){
  const body = document.getElementById('pdfPreviewBody');
  const wrap = document.getElementById('stmtScaleWrap');
  const page = document.getElementById('stmtPage');
  if(!body || !wrap || !page) return;
  const avail = body.clientWidth || 360;
  const PAD = 0; // no border around the A4 page
  const fitScale = Math.min(1, (avail - PAD) / 794);
  const scale = fitScale * pdfZoom;
  page.style.transform = 'scale(' + scale + ')';
  page.style.transformOrigin = 'top left';
  const w = Math.ceil(794 * scale + PAD);
  wrap.style.height = Math.ceil(page.offsetHeight * scale + PAD) + 'px';
  wrap.style.width = w + 'px';
  wrap.style.margin = w <= avail ? '0 auto' : '0';
  const lbl = document.getElementById('pdfZoomLabel');
  if(lbl) lbl.textContent = Math.round(pdfZoom * 100) + '%';
}
let stmtFitBound = false;
function showStatementPreview(html){

  document.getElementById('pdfPreviewBody').innerHTML =
    '<div id="stmtScaleWrap" style="overflow:hidden;background:#fff;padding:0"><div id="stmtPage" style="width:794px;min-height:1123px;background:#fff;padding:10px">' + html + '</div></div>';
  document.getElementById('pdfPreviewSheet').classList.remove('hidden');
  document.getElementById('pdfOverlay').classList.remove('hidden');
  setTimeout(fitStatementPreview, 30);

      if(!document.getElementById('pdfPreviewSheet').classList.contains('hidden')) fitStatementPreview();
    });
  }

    stmtPinchBound = true;

    pb.addEventListener('touchstart', pdfPinchStart, { passive: true });

  }
}

function pdfB64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function pdfBuildFromJpegs(jpegs){
  const enc = new TextEncoder();
  const chunks = [];
  let totalLen = 0;
  const push = (d) => { const b = (typeof d === 'string') ? enc.encode(d) : d; chunks.push(b); totalLen += b.length; };
  const n = jpegs.length;
  const totalObjs = 2 + 3 * n;
  const offsets = new Array(totalObjs + 1).fill(0);
  push('%PDF-1.4\n');
  offsets[1] = totalLen;
  push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = totalLen;
  let kids = '';
  for(let i = 0; i < n; i++) kids += (3 + 3 * i) + ' 0 R ';
  push('2 0 obj\n<< /Type /Pages /Kids [' + kids + '] /Count ' + n + ' >>\nendobj\n');
  for(let i = 0; i < n; i++){
    const pageObj = 3 + 3 * i, imgObj = 4 + 3 * i, contObj = 5 + 3 * i;
    const jj = jpegs[i];
    offsets[pageObj] = totalLen;
    push(pageObj + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im' + i + ' ' + imgObj + ' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ' + contObj + ' 0 R >>\nendobj\n');
    offsets[imgObj] = totalLen;
    push(imgObj + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + jj.w + ' /Height ' + jj.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jj.bytes.length + ' >>\nstream\n');
    push(jj.bytes);
    push('\nendstream\nendobj\n');
    const content = 'q 595 0 0 842 0 0 cm /Im' + i + ' Do Q';
    offsets[contObj] = totalLen;
    push(contObj + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
  }
  const xrefPos = totalLen;
  push('xref\n0 ' + (totalObjs + 1) + '\n');
  push('0000000000 65535 f \n');
  for(let k = 1; k <= totalObjs; k++) push(String(offsets[k]).padStart(10, '0') + ' 00000 n \n');
  push('trailer\n<< /Size ' + (totalObjs + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF');
  return new Blob(chunks, { type: 'application/pdf' });
}

function pdfWrapText(ctx, text, maxW){
  const words = String(text == null ? '' : text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  const pushLine = (l) => { if(l) lines.push(l); };
  const breakWord = (w) => {
    let rest = w;
    while(rest && ctx.measureText(rest).width > maxW){
      let n = 1;
      while(n < rest.length && ctx.measureText(rest.slice(0, n)).width <= maxW) n++;
      if(n <= 1) n = 2;
      pushLine(rest.slice(0, n - 1));
      rest = rest.slice(n - 1);
    }
    return rest;
  };
  for(let w of words){
    if(ctx.measureText(w).width > maxW){
      if(cur){ pushLine(cur); cur = ''; }
      cur = breakWord(w);
    } else {
      const test = cur ? cur + ' ' + w : w;
      if(ctx.measureText(test).width <= maxW) cur = test;
      else { pushLine(cur); cur = w; }
    }
  }
  if(cur) pushLine(cur);
  if(!lines.length) lines.push('');
  return lines;
}

}
function pdfMakeBlob(){
  try{
    const jpegs = pdfStatementJpegs();
    if(!jpegs || !jpegs.length) return null;
    return pdfBuildFromJpegs(jpegs);
  }catch(e){ return null; }
}
function downloadPdfFile(){
  if(pdfBusy) return;
  pdfBusy = true;
  // PDF button: ONLY auto-downloads (no preview, no extra click)
  const blob = pdfMakeBlob();
  pdfBusy = false;
  if(!blob){ showToast(t('pdfFail')); return; }
  const fname = 'lifestyle-' + pdfMode + '-' + today() + '.pdf';
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);

}
function sharePdf(){

  const loans = (person.loans || []).reduce((s, e) => s + (+e.amount || 0), 0);
  const pays = (person.payments || []).reduce((s, e) => s + (+e.amount || 0), 0);
  return { loans: loans, pays: pays, balance: loans - pays };

function personEntriesInRange(person, from, to){

  const loans = (person.loans || []).filter(inR);
  const pays = (person.payments || []).filter(inR);

/* ---------- Phase 3: Add Person ---------- */
let editingPerson = null;
function openAddPerson(kind){
  addPersonKind = kind;
  editingPerson = null;
  document.getElementById('psTitle').textContent = t('addPersonTitle');
  document.getElementById('psName').value = '';
  document.getElementById('psMobile').value = '';
  document.getElementById('personSheet').classList.remove('hidden');
  document.getElementById('personOverlay').classList.remove('hidden');
}
function closeAddPerson(){
  document.getElementById('personSheet').classList.add('hidden');
  document.getElementById('personOverlay').classList.add('hidden');
  editingPerson = null;
}
function openEditPerson(){
  const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  const person = arr[personIdx];
  if(!person) return;
  editingPerson = { kind: personKind, idx: personIdx };
  document.getElementById('psTitle').textContent = t('editPersonTitle');
  document.getElementById('psName').value = person.name || '';
  document.getElementById('psMobile').value = person.mobile || '';
  document.getElementById('personSheet').classList.remove('hidden');
  document.getElementById('personOverlay').classList.remove('hidden');
}
function deletePerson(){
  const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  if(!arr[personIdx]) return;
  if(!confirmTwice(t('confirmDeletePerson'))) return;
  const doomed = arr[personIdx];
  markDeleted(doomed && doomed.id);
  (doomed.loans || []).forEach(e => markDeleted(e.id));
  (doomed.payments || []).forEach(e => markDeleted(e.id));
  state.recycle = state.recycle || [];
  state.recycle.push(Object.assign({}, doomed, { recycledAt: new Date().toISOString(), kind: personKind }));
  arr.splice(personIdx, 1);
  persist();
  showToast(t('personMovedToBin'));
  openLoansPage(personKind);
}
function savePerson(){
  const name = document.getElementById('psName').value.trim();
  if(!name){ showToast(t('needName')); return; }
  const mobile = document.getElementById('psMobile').value.trim();
  if(editingPerson){
    const arr = editingPerson.kind === 'given' ? state.peopleGiven : state.peopleTaken;
    const person = (arr || [])[editingPerson.idx];
    if(person){ person.name = name; person.mobile = mobile; person.updatedAt = new Date().toISOString(); }
    persist();
    flashSaved(document.querySelector('button[onclick="savePerson()"]'), () => { closeAddPerson(); showToast(t('personUpdated')); render(); });
    return;
  }
  const arr = addPersonKind === 'given' ? state.peopleGiven : state.peopleTaken;
  const person = { id: uid(), name: name, mobile: mobile, loans: [], payments: [], updatedAt: new Date().toISOString() };
  arr.push(person);
  persist();
  flashSaved(document.querySelector('button[onclick="savePerson()"]'), () => { closeAddPerson(); showToast(t('personAdded')); openPersonDetail(addPersonKind, arr.length - 1); });
}

function renderPickerList(){
  const arr = pickerKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  const list = arr.map((person, idx) => ({ person: person, idx: idx })).filter(x => {

    : '';
  document.getElementById('pickerList').innerHTML = addRow + (list.length ? list.map(x => {

  }).join('') : '<div class="text-[13px] text-[#8B7355] py-4 text-center">' + t('noPeople') + '</div>');

function pickPerson(pi){
  closePersonPicker();
  if(pickerAction === 'fillLoanForm'){
    const arr = pickerKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
    const person = arr[pi];
    if(person){
      loanFormPersonIdx = pi;
      document.getElementById('lePersonName').value = person.name || '';
      document.getElementById('lePersonMobile').value = person.mobile || '';
      updatePersonSaveBtn();
    }
    return;
  }
  if(pickerAction === 'payment') openLoanEntryForm('addpay', pickerKind, pi);
  else if(pickerAction === 'loan') openLoanEntryForm('addloan', pickerKind, pi);
  else openPersonDetail(pickerKind, pi);
}

    const period = statementPeriod(loansFrom, loansTo, rows);
    return statementHeaderHtml('History - Bank Loan', rows.length, period) + statementEntriesTable(rows, 'noCategory');
  }
  const people = loansPeopleFiltered();
  const period = statementPeriod(loansFrom, loansTo, []);
  if(!people.length) return statementHeaderHtml('History - ' + loansPageTitle(), 0, period) + '<div style="font-size:12px;text-align:center;padding:10px">' + t('noData') + '</div>';
  const secs = people.map(x => personSectionData(x.person, loansKind, loansFrom, loansTo));

    '<h3 style="font-weight:700;font-size:14px;margin:10px 0 4px">' + escA(t('loanEntries')) + '</h3>' + personEntriesTableHtml(sec.loans, t('totalLbl') + ' ' + t('loanEntries'), sec.totalLoans) +
    '<h3 style="font-weight:700;font-size:14px;margin:12px 0 4px">' + escA(t('paymentsSec')) + '</h3>' + personEntriesTableHtml(sec.pays, t('totalLbl') + ' ' + t('paymentsSec'), sec.totalPays) +
    '<h3 style="font-weight:700;font-size:14px;margin:12px 0 4px">' + escA(t('summaryLbl')) + '</h3>' + personSummaryTableHtml(sec) +
    '</div>';
}
function personPdfHtml(){
  const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  const person = arr[personIdx] || { name: '', loans: [], payments: [] };
  const rows = personStatementRows();
  const period = statementPeriod(personFrom, personTo, rows);
  const sec = personSectionData(person, personKind, personFrom, personTo);
  return statementHeaderHtml('History - ' + (person.name || ''), rows.length, period) + personSectionHtml(sec);
}

function personPdfText(){
  const arr = personKind === 'given' ? (state.peopleGiven || []) : (state.peopleTaken || []);
  const person = arr[personIdx] || { name: '', loans: [], payments: [] };
  const tot = personTotals(person);
  const lines = [
    ...(person.loans || []).map(e => (e.date || '') + ' | ' + t('addLoanTitle') + ' | ' + fmt(-e.amount)),
    ...(person.payments || []).map(e => (e.date || '') + ' | ' + t('addPaymentTitle') + ' | ' + fmt(e.amount))
  ];
  return (person.name || '') + '\n' + t('balanceLbl') + ': ' + fmt(tot.balance) + '\n' + lines.join('\n');
}
function openPersonPdf(){
  pdfMode = 'person';
  showStatementPreview(personPdfHtml());
}
function personDownloadPdf(){ pdfMode = 'person'; downloadPdfFile(); }
function personSharePdf(){ pdfMode = 'person'; sharePdf(); }

function csvEsc(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function csvRowsForMode(){
  if(pdfMode === 'history'){
    return [['Date', 'Person', 'Category', 'Note', 'From', 'To', 'Amount']].concat(
      pdfStatementRows().map(r => [fmtDMY(r.date), r.person, r.category, r.comment, r.from, r.to, Math.abs(r.amount)]));
  }
  if(pdfMode === 'homeBank'){
    return [['Date', 'Bank', 'Note', 'From', 'To', 'Amount']].concat(
      homeBankLoansFiltered().map(e => [fmtDMY(e.date || ''), e.bank || e.name || '', e.note || '', e.medium || '', e.medium || '', Math.abs(+(e.amount || 0))]));
  }
  if(pdfMode === 'loans'){
    if(loansKind === 'bank'){
      return [['Date', 'Bank', 'Note', 'From', 'To', 'Amount']].concat(
        (state.bankLoans || []).map(e => [fmtDMY(e.date || ''), e.bank || e.name || '', e.note || '', e.medium || '', e.medium || '', Math.abs(+(e.amount || 0))]));
    }
    return [['Person', 'Mobile', 'Total', loansKind === 'given' ? 'Returned' : 'Repaid', 'Balance']].concat(
      loansPeopleFiltered().map(x => [x.person.name || '', x.person.mobile || '', x.loans, x.pays, x.balance]));
  }
  const rows = [['Date', 'Person', 'Category', 'Note', 'From', 'To', 'Amount']];
  personStatementRows().forEach(r => rows.push([fmtDMY(r.date), r.person, r.category, r.note, r.from, r.to, Math.abs(r.amount)]));
  return rows;
}

function exportCsv(){
  const rows = csvRowsForMode();
  const csv = '\uFEFF' + rows.map(r => r.map(csvEsc).join(',')).join('\n');
  const fname = pdfMode === 'history' ? 'lifestyle-history' : pdfMode === 'loans' ? 'lifestyle-loans-' + loansKind : 'lifestyle-person';
  try{
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} }, 5000);
  }catch(e){
    if(navigator.share){ navigator.share({ title: 'Lifestyle', text: csv }).catch(() => {}); }
  }
  showToast(t('csvSaved'));
}

restoreViewState();
render();
initCloud();

/* ---------- Live clock: updates Time/Date/Day every second ---------- */
function tickClock(){
  const elT = document.getElementById('clockTime');
  const elD = document.getElementById('clockDate');
  const elDy = document.getElementById('clockDay');
  if(!elT && !elD && !elDy) return;
  const now = new Date();
  const dateStr = String(now.getDate()).padStart(2, '0') + ' ' + now.toLocaleString('en-US', { month:'long' }) + ' ' + now.getFullYear();
  const dayStr = now.toLocaleString(lang === 'en' ? 'en-US' : 'bn-BD', { weekday:'long' });
  const timeStr = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  if(elT) elT.textContent = t('time') + ': ' + timeStr;
  if(elD) elD.textContent = t('date') + ': ' + dateStr;
  if(elDy) elDy.textContent = t('day') + ': ' + dayStr;
}
if(typeof process === 'undefined') setInterval(tickClock, 1000);

/* ---------- Android system Back = in-app Back (stay inside the app) ---------- */
function appGoBack(){
  const sheetOpen = id => { const el = document.getElementById(id); return el && !el.classList.contains('hidden'); };
  if(sheetOpen('pdfPreviewSheet')){ closePdfPreview(); return true; }
  if(sheetOpen('pickerSheet')){ closePersonPicker(); return true; }
  if(sheetOpen('personSheet')){ closeAddPerson(); return true; }
  if(sheetOpen('loanEditSheet')){ closeLoanEntryForm(); return true; }
  if(sheetOpen('emiSheet')){ closeEmiChecklist(); return true; }
  if(sheetOpen('formSheet')){ closeForm(); return true; }
  if(sheetOpen('bazarFormSheet')){ closeBazarForm(); return true; }
  if(sheetOpen('bazarSheet')){ closeBazar(); return true; }
  if(sheetOpen('addSheet')){ closeAddSheet(); return true; }
  if(currentView === 'history' && histCat){ histCat = ''; renderHistoryView(); return true; }
  if(currentView === 'person'){ loansKind = personKind; currentView = 'loans'; render(); return true; }
  if(currentView && currentView !== 'home'){ navGo('home'); return true; }
  return true; // Home, nothing open -> stay on Home, never exit the app
}
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('popstate', function(){ if(appGoBack()){ try{ history.pushState({app: true}, ''); }catch(e){} } });
  try{ history.pushState({app: true}, ''); }catch(e){}
}
